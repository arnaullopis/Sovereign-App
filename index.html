<body style="margin:0; padding:0; background:#FFFFFF;">
<style>
  html, body { margin: 0; padding: 0; width: 100%; }
  body { overflow-x: hidden; }
  #libra-app, #libra-app * { -webkit-tap-highlight-color: transparent; }
  #libra-app *, #libra-app *::before, #libra-app *::after { min-width: 0; }
  @keyframes lbFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes lbSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .lb-spin svg { animation: lbSpin .7s linear infinite; }
  @keyframes lbOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lbPanelIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes lbSlideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .lb-fade-in { animation: lbFadeIn .22s ease; }
  #libra-app { font-family: 'OnePlus Sans', 'OnePlus Slate', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #000000; width: 100%; margin: 0 auto; padding-top: 16px; padding-left: 24px; padding-right: 24px; position: relative; }
  #libra-app, #libra-app * { box-sizing: border-box; }
  .lb-num { font-family: 'OnePlus Sans', 'OnePlus Slate', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .lb-serif { font-family: inherit; font-weight: 600; }
  .lb-layout { display: flex; gap: 20px; align-items: flex-start; }
  .lb-sidebar { width: 210px; flex-shrink: 0; background: transparent; padding: 22px 14px 22px 0; position: sticky; top: 0; }
  .lb-main { flex: 1; min-width: 0; }
  .lb-hamburger-btn { display: none; background: transparent; border: none; padding: 6px; cursor: pointer; border-radius: 8px; }
  .lb-hamburger-btn:active { background: #F3F4F6; }
  #lb-refresh-btn svg { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  #lb-refresh-btn:hover svg { transform: rotate(150deg); }
  .lb-nav-backdrop { display: none; }
  @media (max-width: 700px) {
    #libra-app { padding: 0 16px !important; padding-top: max(14px, env(safe-area-inset-top)) !important; }
    .lb-layout { flex-direction: column; gap: 0; }
    .lb-main { padding-top: 16px; width: 100%; }
    .lb-sidebar { width: 100%; position: sticky; top: 0; z-index: 500; background: #FFFFFF; padding: 14px 0; border-bottom: 1px solid #E5E7EB; }
    .lb-hamburger-btn { display: flex; }
    #lb-hero-totals, #lb-scale { display: none; }
    #lb-nav { display: block; position: fixed; top: 0; right: 0; bottom: 0; width: 78%; max-width: 300px; background: #FFFFFF; z-index: 2001; padding: 18px 16px; overflow-y: auto; box-shadow: -8px 0 24px rgba(17,24,39,0.15); transform: translateX(100%); transition: transform .28s cubic-bezier(.22,.9,.34,1); pointer-events: none; visibility: hidden; }
    #lb-nav.lb-nav-open { transform: translateX(0); pointer-events: auto; visibility: visible; }
    .lb-nav-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity .28s ease; }
    .lb-nav-backdrop.lb-nav-open { opacity: 1; pointer-events: auto; }
    .lb-card { padding: 14px; }
    .lb-modal-panel { max-width: 100%; }
    .lb-widget-grip { top: 6px; right: 6px; padding: 12px; opacity: 0.5; touch-action: none; }
    .lb-metric-grid { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
    .lb-metric-grid .lb-card { padding: 12px !important; }
    .lb-metric-grid p:first-child { font-size: 11px !important; margin-bottom: 4px !important; }
  }
  .lb-nav-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #4B5563; cursor: pointer; background: transparent; border: none; border-left: 3px solid transparent; margin-bottom: 2px; font-family: inherit; transition: background .15s, color .15s, transform .1s, border-color .15s; }
  .lb-nav-item:active { transform: scale(0.97); }
  .lb-nav-item:hover { color: #000000; }
  .lb-navicon { transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  @keyframes lbPulseIcon { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .lb-nav-item:hover .lb-navicon-dashboard { transform: translateY(-2.5px); }
  .lb-nav-item:hover .lb-navicon-cuentas { transform: scaleY(1.15); }
  .lb-nav-item:hover .lb-navicon-transacciones { transform: translateX(2px); }
  .lb-nav-item:hover .lb-navicon-cashflow { transform: translate(2px, -2.5px); }
  .lb-nav-item:hover .lb-navicon-gastos { transform: translateY(2.5px); }
  .lb-nav-item:hover .lb-navicon-ingresos { transform: translateY(-2.5px); }
  .lb-nav-item:hover .lb-navicon-presupuesto { transform: rotate(30deg); }
  .lb-nav-item:hover .lb-navicon-recurrentes { transform: rotate(180deg); }
  .lb-nav-item:hover .lb-navicon-metas { animation: lbPulseIcon .5s ease; }
  .lb-nav-item:hover .lb-navicon-deudas { transform: translateY(-2px) rotate(-6deg); }
  .lb-nav-item:hover .lb-navicon-importar { transform: translateY(-3px); }
  .lb-nav-item:hover .lb-navicon-ajustes { transform: rotate(55deg); }
  .lb-nav-item.active { color: #FF6600; font-weight: 700; border-left-color: #FF6600; }
  .lb-nav-sub { padding-left: 24px; font-size: 12.5px; }
  .lb-nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #6B7280; margin: 14px 0 4px 12px; }
  .lb-nav-divider { height: 10px; border-top: 1px solid #E5E7EB; margin: 10px 0; }
  .lb-card { background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(17,24,39,0.04), 0 6px 14px rgba(17,24,39,0.08), 0 14px 28px rgba(17,24,39,0.05); }
  .lb-metric-grid .lb-card > span { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .lb-metric-grid .lb-card span.lb-num:last-child:not(:first-child) { margin-left: 0 !important; }
  .lb-widget { cursor: grab; position: relative; transition: box-shadow .15s, opacity .15s, transform .15s; }
  .lb-widget:active { cursor: grabbing; }
  .lb-widget.dragging { opacity: 0.45; box-shadow: 0 8px 20px rgba(17,24,39,0.15); }
  .lb-widget-grip { position: absolute; top: 14px; right: 14px; display: flex; gap: 3px; opacity: 0.35; touch-action: none; }
  .lb-widget-grip span { width: 3px; height: 3px; border-radius: 50%; background: #6B7280; }
  .lb-input, .lb-select { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #D1D5DB; border-radius: 8px; background: #FFFFFF; color: #000000; width: 100%; box-shadow: inset 0 1px 2px rgba(17,24,39,0.04); }
  .lb-search-bar { position: relative; }
  .lb-search-bar input { font-family: inherit; font-size: 13px; padding: 9px 12px 9px 34px; border: 1px solid transparent; border-radius: 999px; background: #F3F4F6; color: #000000; width: 100%; box-shadow: none; transition: background .15s, box-shadow .15s; }
  .lb-search-bar input::placeholder { color: #9CA3AF; }
  .lb-search-bar input:focus { outline: none; background: #FFFFFF; border-color: #FF6600; box-shadow: 0 0 0 2px rgba(255,102,0,0.15); }
  .lb-search-bar svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .lb-filter-pill { font-family: inherit; font-size: 13px; padding: 9px 14px; border: 1px solid transparent; border-radius: 999px; background: #F3F4F6; color: #000000; box-shadow: none; transition: background .15s, box-shadow .15s; }
  .lb-filter-pill:focus { outline: none; background: #FFFFFF; border-color: #FF6600; box-shadow: 0 0 0 2px rgba(255,102,0,0.15); }
  .lb-input:focus, .lb-select:focus { outline: none; border-color: #FF6600; box-shadow: 0 0 0 2px rgba(234,88,12,0.15); }
  .lb-btn { font-family: inherit; font-size: 13px; padding: 9px 16px; border-radius: 8px; border: 1px solid #000000; background: #000000; color: #FFFFFF; cursor: pointer; transition: background .15s, transform .1s, box-shadow .15s; box-shadow: 0 1px 2px rgba(17,24,39,0.2), 0 2px 5px rgba(17,24,39,0.1); }
  .lb-btn:hover { background: #262626; box-shadow: 0 2px 5px rgba(17,24,39,0.25), 0 3px 8px rgba(17,24,39,0.12); }
  .lb-btn:active { transform: scale(0.96); box-shadow: 0 1px 2px rgba(17,24,39,0.15); }
  .lb-btn-ghost { background: transparent; color: #000000; border: 1px solid #D1D5DB; transition: background .15s, transform .1s, box-shadow .15s; box-shadow: 0 1px 2px rgba(17,24,39,0.04); }
  .lb-btn-ghost:hover { background: #F3F4F6; box-shadow: 0 2px 4px rgba(17,24,39,0.06); }
  .lb-btn-ghost:active { transform: scale(0.96); }
  .lb-btn-danger { background: transparent; color: #DC2626; border: 1px solid #FECACA; transition: background .15s, transform .1s; }
  .lb-btn-danger:hover { background: #FEF2F2; }
  .lb-btn-danger:active { transform: scale(0.96); }
  .lb-row-click { display: flex; align-items: center; justify-content: space-between; padding: 11px 4px; border-bottom: 1px solid #F3F4F6; gap: 10px; cursor: pointer; border-radius: 8px; transition: background .15s, transform .1s; }
  .lb-card-click { cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .12s; }
  .lb-card-click:hover { border-color: #FF6600; box-shadow: 0 2px 4px rgba(17,24,39,0.06), 0 10px 20px rgba(17,24,39,0.12), 0 20px 36px rgba(17,24,39,0.08); transform: translateY(-2px); }
  .lb-card-click:active { transform: translateY(0) scale(0.99); }
  .lb-title-link { cursor: pointer; transition: color .15s; }
  .lb-title-link:hover { color: #FF6600; text-decoration: underline; }
  .lb-mini-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; margin: 0 -4px 4px; border-radius: 6px; cursor: pointer; transition: background .15s, transform .1s; }
  .lb-mini-row:hover { background: #F3F4F6; }
  .lb-mini-row:active { transform: scale(0.99); }
  .lb-search-result { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #F3F4F6; transition: background .12s, padding-left .12s; }
  .lb-search-result:hover { background: #FEF3E2; padding-left: 16px; }
  .lb-search-result:active { background: #FDE9C8; }
  .lb-check-label { display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 6px; padding: 4px 6px; margin: 0 -6px; transition: background .12s; }
  .lb-check-label:hover { background: #F3F4F6; }
  .lb-clickable-text { cursor: pointer; transition: color .12s; border-radius: 4px; }
  .lb-clickable-text:hover { color: #FF6600; text-decoration: underline; text-underline-offset: 2px; }
  .lb-row-click:last-child { border-bottom: none; }
  .lb-row-click:hover { background: #F3F4F6; }
  .lb-row-click:active { transform: scale(0.99); background: #EEF2F5; }
  .lb-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; letter-spacing: .02em; }
  .lb-tag-eur { background: #E1EAF5; color: #2D4F7C; }
  .lb-tag-aud { background: #FEF3E2; color: #E65C00; }
  .lb-bar-track { background: #F3F4F6; border-radius: 999px; height: 8px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(17,24,39,0.07); }
  .lb-bar-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.22,.9,.34,1); }
  @keyframes lbShimmer { 0% { background-position: 0% 0; } 100% { background-position: -200% 0; } }
  .lb-bar-complete { background: linear-gradient(90deg, #FF6600, #FFC299, #FF6600, #FF8A33) !important; background-size: 250% 100%; animation: lbShimmer 2.2s linear infinite; }
  .lb-goal-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #FF6600; margin-left: 6px; flex-shrink: 0; }
  .lb-section-title { font-size: 12px; color: #6B7280; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  .lb-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; animation: lbOverlayIn .15s ease; }
  .lb-modal-panel { background: #FFFFFF; border-radius: 16px; padding: 22px 22px 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; animation: lbPanelIn .2s cubic-bezier(.22,.9,.34,1); box-shadow: 0 25px 50px -8px rgba(17,24,39,0.25), 0 10px 20px rgba(17,24,39,0.12); }
  .lb-modal-overlay.lb-modal-noanim, .lb-modal-panel.lb-modal-noanim { animation: none; }
  .lb-modal-close { background: transparent; border: none; color: #6B7280; font-size: 20px; cursor: pointer; line-height: 1; padding: 4px; transition: transform .1s; }
  .lb-modal-close:active { transform: scale(0.85); }
  .lb-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px; }
  .lb-detail-row:last-child { border-bottom: none; }  .lb-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .lb-add-btn { background: #FF6600; color: #FFFFFF; border: none; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; transition: background .15s, transform .1s, box-shadow .15s; box-shadow: 0 2px 6px rgba(255,102,0,0.35), 0 1px 2px rgba(255,102,0,0.2); }
  .lb-add-btn:hover { background: #E65C00; box-shadow: 0 3px 10px rgba(255,102,0,0.4), 0 1px 3px rgba(255,102,0,0.25); }
  .lb-add-btn:active { transform: scale(0.95); box-shadow: 0 1px 3px rgba(255,102,0,0.3); }
  .lb-toggle-btn { background: transparent; color: #6B7280; border: 1px solid #D1D5DB; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
  .lb-period-link { background: none; border: none; padding: 0; font-size: 12px; font-weight: 500; color: #9CA3AF; cursor: pointer; font-family: inherit; }
  .lb-period-link.active { color: #FF6600; font-weight: 700; }
  .lb-toggle-btn:hover:not(.active) { background: #F3F4F6; }
  .lb-toggle-btn.active { background: #FF6600; color: #FFFFFF; border-color: #FF6600; box-shadow: 0 2px 6px rgba(255,102,0,0.3); }
  .lb-toggle-btn.active:hover { background: #E65C00; }
  .lb-toggle-btn:active { transform: scale(0.96); }
  .lb-add-panel { animation: lbSlideDown .18s ease; transform-origin: top; }
  .lb-add-panel input, .lb-add-panel select { background: #F3F4F6; border: 1px solid transparent; box-shadow: none; }
  .lb-add-panel input::placeholder { color: #9CA3AF; }
  .lb-add-panel input:focus, .lb-add-panel select:focus { outline: none; background: #FFFFFF; border-color: #FF6600; box-shadow: 0 0 0 2px rgba(255,102,0,0.15); }
</style>

  function addInterval(dateStr, freq){
    var d = new Date(dateStr + 'T00:00:00');
    if (freq === 'weekly') d.setDate(d.getDate() + 7);
    else if (freq === 'yearly') d.setFullYear(d.getFullYear() + 1);

  function generateDueRecurring(){
    var d = state.data, today = new Date().toISOString().slice(0,10), changed = false;
    (d.recurring || []).forEach(function(rec){
      if (!rec.active) return;
      var next = rec.lastGenerated ? addInterval(rec.lastGenerated, rec.frequency) : rec.startDate;
      var guard = 0;
      while (next <= today && guard < 60){
        var tr = { id: uid(), date: next, desc: rec.desc, amount: rec.amount, currency: rec.currency, kind: rec.kind, category: rec.category, accountId: rec.accountId || null, goalId: rec.goalId || null, recurringId: rec.id };
        d.transactions.unshift(tr);
        applyTxToAccount(tr, 1);
        applyTxToGoal(tr, 1);
        rec.lastGenerated = next;
        next = addInterval(next, rec.frequency);
        changed = true;
        guard++;
      }
    });
    return changed;
  }

  var libraDB = (function(){
    var dbPromise = null;
    function openDB(){
      if (dbPromise) return dbPromise;
      dbPromise = new Promise(function(resolve, reject){
        if (typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB no disponible')); return; }
        var req = indexedDB.open('libra-db', 1);
        req.onupgradeneeded = function(e){
          var db = e.target.result;
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        };
        req.onsuccess = function(e){ resolve(e.target.result); };
        req.onerror = function(e){ reject(e.target.error); };
      });
      return dbPromise;
    }
    var idb = {
      get: function(key){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readonly');
            var req = tx.objectStore('kv').get(key);
            req.onsuccess = function(){ resolve(req.result === undefined ? null : { key: key, value: req.result }); };
            req.onerror = function(){ reject(req.error); };
          });
        });
      },
      set: function(key, value){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').put(value, key);
            tx.oncomplete = function(){ resolve({ key: key, value: value }); };
            tx.onerror = function(){ reject(tx.error); };
          });
        });
      },
      delete: function(key){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').delete(key);
            tx.oncomplete = function(){ resolve({ key: key, deleted: true }); };
            tx.onerror = function(){ reject(tx.error); };
          });
        });
      },
      list: function(prefix){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readonly');
            var req = tx.objectStore('kv').getAllKeys();
            req.onsuccess = function(){
              var keys = req.result.filter(function(k){ return !prefix || String(k).indexOf(prefix) === 0; });
              resolve({ keys: keys });
            };
            req.onerror = function(){ reject(req.error); };
          });
        });
      }
    };
    // Use Claude's artifact storage when available (inside claude.ai); otherwise fall back to IndexedDB
    // (e.g. when the file is opened directly in a browser, or installed as a standalone/Mac/Android app).
    var useClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);
    return {
      get: function(key){ return useClaudeStorage ? window.storage.get(key) : idb.get(key); },
      set: function(key, value){ return useClaudeStorage ? window.storage.set(key, value) : idb.set(key, value); },
      delete: function(key){ return useClaudeStorage ? window.storage.delete(key) : idb.delete(key); },
      list: function(prefix){ return useClaudeStorage ? window.storage.list(prefix) : idb.list(prefix); }
    };
  })();

        loaded.secondaryCurrency = loaded.secondaryCurrency || 'EUR';
        delete loaded.rate;

      if (loaded.secondaryCurrency === undefined) loaded.secondaryCurrency = 'EUR';
      if (loaded.secondaryCurrency && !loaded.rates[loaded.secondaryCurrency]) loaded.rates[loaded.secondaryCurrency] = 1;

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (attrs[k] === undefined || attrs[k] === null) continue;
      if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function computeNetWorthSeries(days){
    var d = state.data;
    var today = new Date();
    var series = [];
    // Precompute per-account transactions sorted by date (only linked ones affect reconstruction)
    var txByAccount = {};
    d.transactions.forEach(function(tr){
      if (!tr.accountId) return;
      (txByAccount[tr.accountId] = txByAccount[tr.accountId] || []).push(tr);
    });
    for (var i = days; i >= 0; i--){
      var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var dateStr = dt.toISOString().slice(0,10);
      var total = 0;
      d.accounts.forEach(function(a){
        var bal = a.balance;
        var txs = txByAccount[a.id] || [];
        txs.forEach(function(tr){
          if (tr.date > dateStr){
            var effect = (tr.kind === 'income' ? 1 : -1) * convertAmount(tr.amount, tr.currency, a.currency, d.rate);
            bal -= effect;
          }
        });
        total += convertAmount(bal, a.currency, d.baseCurrency);
      });
      series.push({ date: dateStr, value: Math.round(total*100)/100 });
    }
    return series;
  }

  function computeTotals(){
    var d = state.data, aud = 0;
    var byType = { cash:0, savings:0, investment:0 };
    d.accounts.forEach(function(a){
      var v = convertAmount(a.balance, a.currency, d.baseCurrency);
      aud += v; byType[a.type] += v;
    });
    var sec = d.secondaryCurrency ? convertAmount(aud, d.baseCurrency, d.secondaryCurrency) : 0;
    return { aud: aud, eur: sec, byType: byType };
  }

  function incomeByCategoryPerMonth(months){
    var d = state.data, now = new Date();
    var keys = [];
    for (var i = months-1; i >= 0; i--){
      var dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'));
    }
    var byCat = {}, totalsByCat = {};
    d.transactions.forEach(function(tr){
      if (tr.kind !== 'income' || tr.isTransfer) return;
      var idx = keys.indexOf(monthKey(tr.date));
      if (idx === -1) return;
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      byCat[tr.category] = byCat[tr.category] || new Array(months).fill(0);
      byCat[tr.category][idx] += v;
      totalsByCat[tr.category] = (totalsByCat[tr.category]||0) + v;
    });
    var categories = Object.keys(totalsByCat).sort(function(a,b){ return totalsByCat[b]-totalsByCat[a]; });
    return { labels: keys.map(monthLabel), categories: categories, data: byCat };
  }

  function svgSankey(entries, singleOnLeft){
    var total = entries.reduce(function(s,e){ return s+e[1]; }, 0) || 1;
    var barW = 14, gap = 8, padT = 16, padB = 16, padSide = 92;
    var rowH = 34;
    var H = Math.max(180, padT + padB + entries.length * rowH);
    var W = 680;
    var innerH = H - padT - padB;
    var usableH = innerH - gap * Math.max(0, entries.length - 1);
    var xLeft = padSide, xRight = W - padSide - barW;
    var multiX = singleOnLeft ? xRight : xLeft;
    var singleX = singleOnLeft ? xLeft : xRight;
    var totalBarH = usableH + gap * Math.max(0, entries.length - 1);

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:100%; display:block; overflow:visible;">';

    var y = padT;
    var segs = entries.map(function(e){
      var h = (e[1]/total) * usableH;
      var seg = { label: e[0], value: e[1], pct: e[1]/total*100, y0: y, y1: y+h, color: categoryColor(e[0]) };
      y += h + gap;
      return seg;
    });

    var leftEdge = singleOnLeft ? singleX + barW : multiX + barW;
    var rightEdge = singleOnLeft ? multiX : singleX;
    var midX = (leftEdge + rightEdge) / 2;

    segs.forEach(function(seg, i){
      var pathTop = 'M'+leftEdge+','+seg.y0+' C'+midX+','+seg.y0+' '+midX+','+seg.y1+' '+rightEdge+','+seg.y1;
      var pathBottom = 'L'+rightEdge+','+seg.y1+' C'+midX+','+seg.y1+' '+midX+','+seg.y0+' '+leftEdge+','+seg.y0+' Z';
      svg += '<path class="lb-sankey-flow" data-idx="'+i+'" d="'+pathTop+' '+pathBottom+'" fill="'+seg.color+'" opacity="0.3" style="cursor:pointer; transition:opacity .15s;"/>';
    });

    segs.forEach(function(seg, i){
      svg += '<rect class="lb-sankey-seg" data-idx="'+i+'" x="'+multiX+'" y="'+seg.y0.toFixed(1)+'" width="'+barW+'" height="'+(seg.y1-seg.y0).toFixed(1)+'" fill="'+seg.color+'" rx="2" style="cursor:pointer;"/>';
      var midY = (seg.y0+seg.y1)/2;
      var labelX = singleOnLeft ? multiX + barW + 8 : multiX - 8;
      var anchor = singleOnLeft ? 'start' : 'end';
      svg += '<text x="'+labelX+'" y="'+(midY-4).toFixed(1)+'" font-size="11" fill="#111827" font-weight="600" text-anchor="'+anchor+'">'+seg.label+'</text>';
      svg += '<text x="'+labelX+'" y="'+(midY+10).toFixed(1)+'" font-size="10" fill="#9CA3AF" text-anchor="'+anchor+'">'+seg.pct.toFixed(1)+'%</text>';
    });

    svg += '<rect x="'+singleX+'" y="'+padT+'" width="'+barW+'" height="'+totalBarH.toFixed(1)+'" fill="#111827" rx="2"/>';
    var totalLabelX = singleOnLeft ? singleX + barW/2 : singleX + barW/2;
    svg += '<text x="'+totalLabelX+'" y="'+(padT-6)+'" font-size="11" fill="#6B7280" text-anchor="middle">Total</text>';

    svg += '</svg>';
    return svg;
  }

  function monthlyFlows(months){
    var d = state.data, now = new Date();
    var keys = [];
    for (var i = months-1; i >= 0; i--){
      var dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'));
    }
    var map = {};
    keys.forEach(function(k){ map[k] = { income:0, expense:0 }; });
    d.transactions.forEach(function(tr){
      if (tr.isTransfer) return;
      var k = monthKey(tr.date);
      if (map[k] === undefined) return;
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      if (tr.kind === 'income') map[k].income += v; else map[k].expense += v;
    });
    return keys.map(function(k){ return { key:k, label: monthLabel(k), income: map[k].income, expense: map[k].expense, net: map[k].income - map[k].expense }; });
  }

  function categoryTotals(kind, months){
    var d = state.data, now = new Date();
    var cutoff = new Date(now.getFullYear(), now.getMonth()-months+1, 1);
    var totals = {};
    d.transactions.forEach(function(tr){
      if (tr.kind !== kind || tr.isTransfer) return;
      var dt = new Date(tr.date);
      if (isNaN(dt) || dt < cutoff) return;
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      totals[tr.category] = (totals[tr.category] || 0) + v;
    });
    return totals;
  }
  function categorySpendForMonth(category, monthKeyStr){
    var d = state.data;
    return d.transactions.filter(function(tr){ return tr.kind === 'expense' && !tr.isTransfer && tr.category === category && monthKey(tr.date) === monthKeyStr; })
      .reduce(function(s,tr){ return s + convertAmount(tr.amount, tr.currency, d.baseCurrency); }, 0);
  }
  function monthTotals(monthKeyStr){
    var d = state.data, income = 0, expense = 0;
    d.transactions.forEach(function(tr){
      if (tr.isTransfer || monthKey(tr.date) !== monthKeyStr) return;
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);

  function shiftMonthKey(monthKeyStr, delta){
    var parts = monthKeyStr.split('-');
    var dt = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1 + delta, 1);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
  }
  function budgetAvailable(b){
    if (!b.rollover) return b.limit;
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    var start = b.startMonth || currentKey;
    var cursor = new Date(start + '-01T00:00:00');
    var carry = 0, guard = 0;
    while (true){
      var key = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0');
      if (key >= currentKey || guard > 60) break;
      carry += (b.limit - categorySpendForMonth(b.category, key));
      cursor.setMonth(cursor.getMonth() + 1);
      guard++;
    }
    return b.limit + carry;
  }

  function netWorthGeometry(series){
    var W = 680, H = 230, padL = 54, padR = 10, padT = 14, padB = 26;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var vals = series.map(function(p){ return p.value; });
    var maxV = Math.max.apply(null, vals), minV = Math.min.apply(null, vals);
    var range = maxV - minV || 1;
    var padRange = range * 0.12;
    maxV += padRange; minV -= padRange;
    var n = series.length || 1;
    function x(i){ return padL + (i/(n-1||1)) * innerW; }
    function y(v){ return padT + innerH - ((v-minV)/(maxV-minV)) * innerH; }
    return { W:W, H:H, padL:padL, padR:padR, padT:padT, padB:padB, innerW:innerW, innerH:innerH, minV:minV, maxV:maxV, n:n, x:x, y:y };

    var geo = netWorthGeometry(series);
    var W=geo.W, H=geo.H, padL=geo.padL, padR=geo.padR, padT=geo.padT, innerH=geo.innerH, minV=geo.minV, maxV=geo.maxV, n=geo.n, x=geo.x, y=geo.y;

    var pts = series.map(function(p,i){ return [x(i), y(p.value)]; });
    function smoothPath(points){
      if (points.length < 2) return '';
      var d = 'M'+points[0][0].toFixed(1)+','+points[0][1].toFixed(1);
      for (var i = 0; i < points.length - 1; i++){
        var p0 = points[i === 0 ? 0 : i-1];
        var p1 = points[i];
        var p2 = points[i+1];
        var p3 = points[i+2 < points.length ? i+2 : i+1];
        var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;

    var step = Math.max(1, Math.floor((n-1)/6));

    svg += '<rect class="lb-nw-capture" x="'+padL+'" y="0" width="'+(W-padL-padR)+'" height="'+H+'" fill="transparent" style="cursor:crosshair;"/>';

  function dualLineGeometry(flows){
    var W = 680, H = 260, padL = 50, padR = 10, padT = 14, padB = 26;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var allVals = [0];
    flows.forEach(function(f){ allVals.push(f.income, f.expense); });
    var maxV = Math.max.apply(null, allVals) * 1.12 || 1;
    var n = flows.length || 1;
    function x(i){ return padL + (i/(n-1||1)) * innerW; }
    function y(v){ return padT + innerH - (v/maxV) * innerH; }
    return { W:W, H:H, padL:padL, padR:padR, padT:padT, innerW:innerW, innerH:innerH, maxV:maxV, n:n, x:x, y:y };
  }
  function smoothPathFromPoints(points){

    var d = 'M'+points[0][0].toFixed(1)+','+points[0][1].toFixed(1);
    for (var i = 0; i < points.length - 1; i++){
      var p0 = points[i === 0 ? 0 : i-1], p1 = points[i], p2 = points[i+1], p3 = points[i+2 < points.length ? i+2 : i+1];
      var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
      var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
      d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
    }
    return d;
  }

    svg += '<rect class="lb-cf-capture" x="'+geo.padL+'" y="0" width="'+(geo.W-geo.padL-geo.padR)+'" height="'+geo.H+'" fill="transparent" style="cursor:crosshair;"/>';
    svg += '</svg>';

  function renderDoughnut(entries, colors){
    var wrap = el('div', {style:'display:flex; align-items:center; justify-content:center; height:100%; position:relative; padding:10px 0;'});
    var total = entries.reduce(function(s,e){ return s+e[1]; }, 0);
    if (total <= 0){
      wrap.appendChild(el('p', {style:'font-size:12px; color:#6B7280;'}, [t('sinDatos')]));
      return wrap;
    }
    var size = 300, cx = size/2, cy = size/2 - 6, r = 66, explode = 9, depth = 7;
    function polar(angleDeg, radius, ox, oy){
      var a = (angleDeg - 90) * Math.PI / 180;
      return [ox + radius * Math.cos(a), oy + radius * Math.sin(a)];
    }
    var acc = 0;
    var slices = entries.map(function(e, i){
      var startAngle = acc / total * 360;
      acc += e[1];
      var endAngle = acc / total * 360;
      var midAngle = (startAngle + endAngle) / 2;
      var gap = entries.length > 1 ? 1.2 : 0;
      var a0 = startAngle + gap, a1 = endAngle - gap;
      var dir = polar(midAngle, 1, 0, 0);
      var ox = cx + dir[0]*explode, oy = cy + dir[1]*explode;
      var p0 = polar(a0, r, ox, oy), p1 = polar(a1, r, ox, oy);
      var largeArc = (a1 - a0) > 180 ? 1 : 0;
      var path = 'M'+ox+','+oy+' L'+p0[0]+','+p0[1]+' A'+r+','+r+' 0 '+largeArc+',1 '+p1[0]+','+p1[1]+' Z';
      var labelPt = polar(midAngle, r + explode + 26, cx, cy);
      var edgePt = polar(midAngle, r + explode, ox, oy);
      return { e:e, i:i, path:path, ox:ox, oy:oy, color: categoryColor(e[0]), labelPt:labelPt, edgePt:edgePt, midAngle:midAngle, pct: e[1]/total*100 };
    });

    var svg = '<svg viewBox="0 0 '+size+' '+size+'" style="width:100%; height:auto; overflow:visible; display:block;">';
    svg += '<g class="lb-pie3d-group" style="transform-origin:'+cx+'px '+cy+'px; transform:scale(0.7); opacity:0; transition:transform .5s cubic-bezier(.22,1.2,.36,1), opacity .4s ease;">';
    // depth/base layer first (darker, shifted down) for a 3D thickness illusion
    slices.forEach(function(s){
      svg += '<path d="'+s.path+'" transform="translate(0,'+depth+')" fill="'+s.color+'" opacity="0.55" stroke="#FFFFFF" stroke-width="1"/>';
    });
    // top faces
    slices.forEach(function(s){
      svg += '<path class="lb-pie3d-seg" data-idx="'+s.i+'" d="'+s.path+'" fill="'+s.color+'" stroke="#FFFFFF" stroke-width="1.5" style="cursor:pointer; transition:opacity .15s, filter .15s;"/>';
    });
    // leader lines + labels for the top 5 categories only, to keep it legible
    var labeled = slices.slice(0, 5);
    labeled.forEach(function(s){
      svg += '<line x1="'+s.edgePt[0]+'" y1="'+s.edgePt[1]+'" x2="'+s.labelPt[0]+'" y2="'+s.labelPt[1]+'" stroke="#D1D5DB" stroke-width="1"/>';
      var anchor = s.labelPt[0] < cx ? 'end' : 'start';
      var dx = s.labelPt[0] < cx ? -4 : 4;
      svg += '<circle cx="'+s.labelPt[0]+'" cy="'+s.labelPt[1]+'" r="2.5" fill="'+s.color+'"/>';
      svg += '<text x="'+(s.labelPt[0]+dx)+'" y="'+(s.labelPt[1]-4)+'" font-size="10" font-weight="600" fill="#111827" text-anchor="'+anchor+'">'+s.e[0]+'</text>';
      svg += '<text x="'+(s.labelPt[0]+dx)+'" y="'+(s.labelPt[1]+8)+'" font-size="9" fill="#9CA3AF" text-anchor="'+anchor+'">'+s.pct.toFixed(1)+'%</text>';
    });
    svg += '</g></svg>';

    var chartWrap = el('div', {style:'position:relative; width:100%;', html: svg});
    wrap.appendChild(chartWrap);

    var tooltip = el('div', {style:'position:absolute; display:none; pointer-events:none; background:#000000; color:#FFFFFF; padding:7px 11px; border-radius:8px; font-size:11px; white-space:nowrap; z-index:5; box-shadow:0 4px 10px rgba(0,0,0,0.15); transform:translate(-50%,-115%);'});
    wrap.style.position = 'relative';
    wrap.appendChild(tooltip);

    setTimeout(function(){
      var group = chartWrap.querySelector('.lb-pie3d-group');
      if (group) group.style.cssText += 'transform:scale(1); opacity:1;';
    }, 30);

    var segs = chartWrap.querySelectorAll('.lb-pie3d-seg');
    segs.forEach(function(seg){
      var idx = parseInt(seg.getAttribute('data-idx'), 10);
      var s = slices[idx];
      seg.addEventListener('mouseenter', function(){
        segs.forEach(function(x){ x.style.opacity = '0.4'; });
        seg.style.opacity = '1';
        seg.style.filter = 'brightness(1.08)';
        var rect = seg.getBoundingClientRect();
        var wrapRect = chartWrap.getBoundingClientRect();
        tooltip.innerHTML = '<div style="font-weight:600;">'+s.e[0]+'</div><div style="opacity:0.75; font-size:10px;">'+fmt(s.e[1],state.data.baseCurrency)+' \u00b7 '+s.pct.toFixed(1)+'%</div>';
        tooltip.style.left = (rect.left - wrapRect.left + rect.width/2) + 'px';
        tooltip.style.top = (rect.top - wrapRect.top) + 'px';
        tooltip.style.display = 'block';
      });
      seg.addEventListener('mouseleave', function(){
        segs.forEach(function(x){ x.style.opacity = '1'; x.style.filter = 'none'; });
        tooltip.style.display = 'none';
      });
    });
    return wrap;
  }

  var lastModalKey = null;
  function renderModal(){
    var root = document.getElementById('lb-modal-root');
    root.innerHTML = '';
    if (!state.detail){ lastModalKey = null; return; }
    var d = state.detail;
    var currentKey = d.type + ':' + d.id;
    MODAL_ANIMATE = (currentKey !== lastModalKey);
    lastModalKey = currentKey;
    var item;
    if (d.type === 'account') item = state.data.accounts.find(function(x){ return x.id === d.id; });
    else if (d.type === 'transaction') item = state.data.transactions.find(function(x){ return x.id === d.id; });
    else if (d.type === 'budget') item = state.data.budgets.find(function(x){ return x.id === d.id; });
    else if (d.type === 'goal') item = state.data.goals.find(function(x){ return x.id === d.id; });
    else if (d.type === 'recurring') item = state.data.recurring.find(function(x){ return x.id === d.id; });
    else if (d.type === 'debt') item = state.data.debts.find(function(x){ return x.id === d.id; });
    if (!item){ state.detail = null; lastModalKey = null; return; }

    if (d.type === 'account') root.appendChild(renderAccountModal(item));
    else if (d.type === 'transaction') root.appendChild(renderTransactionModal(item));
    else if (d.type === 'budget') root.appendChild(renderBudgetModal(item));
    else if (d.type === 'goal') root.appendChild(renderGoalModal(item));
    else if (d.type === 'recurring') root.appendChild(renderRecurringModal(item));
    else if (d.type === 'debt') root.appendChild(renderDebtModal(item));
  }

  function renderHoldingsSection(a){
    var d = state.detail;
    var wrap = el('div', {style:'margin-top:16px; padding-top:14px; border-top:1px solid #F3F4F6;'});
    wrap.appendChild(el('p', {class:'lb-section-title', style:'margin:0 0 8px;'}, ['Activos de esta cuenta']));
    var holdings = state.data.holdings.filter(function(h){ return h.accountId === a.id; });
    var totalValue = 0, totalCost = 0;
    holdings.forEach(function(h){ totalValue += h.quantity*h.currentPrice; totalCost += h.quantity*h.avgCost; });
    if (holdings.length === 0){
      wrap.appendChild(el('p', {style:'font-size:12px; color:#6B7280; margin:0 0 10px;'}, [t('hintSinActivos')]));
    } else {

  function renderDashboard(container){
    var order = state.data.dashboardOrder || Object.keys(DASHBOARD_WIDGETS);
    var draggedEl = null;

    order.forEach(function(widgetId){
      var builder = DASHBOARD_WIDGETS[widgetId];
      if (!builder) return;
      var wrap = el('div', {class:'lb-widget', style:'margin-bottom:16px;', draggable:'true', 'data-widget-id': widgetId});
      var grip = el('div', {class:'lb-widget-grip'}, [el('span',{}),el('span',{}),el('span',{})]);
      wrap.appendChild(grip);
      wrap.appendChild(builder());

      function reorderTo(targetWrap, clientY){
        if (!targetWrap || targetWrap === wrap) return;
        var rect = targetWrap.getBoundingClientRect();
        var midpoint = rect.top + rect.height / 2;
        if (clientY < midpoint){
          if (targetWrap.previousSibling !== wrap) container.insertBefore(wrap, targetWrap);
        } else {
          if (targetWrap.nextSibling !== wrap) container.insertBefore(wrap, targetWrap.nextSibling);
        }
      }
      function commitOrder(){
        wrap.classList.remove('dragging');
        var newOrder = [...container.querySelectorAll('.lb-widget')].map(function(w){ return w.getAttribute('data-widget-id'); });
        state.data.dashboardOrder = newOrder;
        saveData();
      }

      wrap.addEventListener('dragstart', function(e){
        draggedEl = wrap;
        wrap.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      wrap.addEventListener('dragend', function(){ draggedEl = null; commitOrder(); });
      wrap.addEventListener('dragover', function(e){
        e.preventDefault();
        if (draggedEl && draggedEl !== wrap){
          var dragWrap = draggedEl;
          var rect = wrap.getBoundingClientRect();
          var midpoint = rect.top + rect.height / 2;
          if (e.clientY < midpoint){
            if (wrap.previousSibling !== dragWrap) container.insertBefore(dragWrap, wrap);
          } else {
            if (wrap.nextSibling !== dragWrap) container.insertBefore(dragWrap, wrap.nextSibling);
          }
        }
      });

      // Touch support (mobile): drag only from the grip handle, so page scroll and
      // in-card taps keep working normally everywhere else on the widget.
      grip.addEventListener('touchstart', function(e){
        wrap.classList.add('dragging');
        e.preventDefault();
      }, {passive:false});
      grip.addEventListener('touchmove', function(e){
        e.preventDefault();
        var touch = e.touches[0];
        var target = document.elementFromPoint(touch.clientX, touch.clientY);
        var targetWrap = target && target.closest ? target.closest('.lb-widget') : null;
        if (targetWrap) reorderTo(targetWrap, touch.clientY);
      }, {passive:false});
      grip.addEventListener('touchend', function(){ commitOrder(); });
      grip.addEventListener('touchcancel', function(){ commitOrder(); });

      container.appendChild(wrap);
    });
  }

  // ---- CASH FLOW ----
  function renderCashflow(container){
    var d = state.data;
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    var monthNames = MONTHS_FULL[state.data.language] || MONTHS_FULL.es;
    var monthTx = d.transactions.filter(function(tr){ return monthKey(tr.date) === currentKey; });
    var incomeBySource = {}, expenseByCategory = {};
    monthTx.forEach(function(tr){
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      if (tr.kind === 'income') incomeBySource[tr.category] = (incomeBySource[tr.category]||0) + v;
      else expenseByCategory[tr.category] = (expenseByCategory[tr.category]||0) + v;
    });
    var incomeEntries = Object.keys(incomeBySource).map(function(k){ return [k, incomeBySource[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var expenseEntries = Object.keys(expenseByCategory).map(function(k){ return [k, expenseByCategory[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var totalIncome = incomeEntries.reduce(function(s,e){ return s+e[1]; }, 0);
    var totalExpense = expenseEntries.reduce(function(s,e){ return s+e[1]; }, 0);
    var netIncome = totalIncome - totalExpense;
    var savingsRate = totalIncome > 0 ? (netIncome/totalIncome*100) : 0;

    var prevKey = shiftMonthKey(currentKey, -1);
    var prevTotals = monthTotals(prevKey);
    function pctChange(cur, prev){
      if (prev <= 0) return null;
      return ((cur-prev)/prev*100);
    }
    var incomeChange = pctChange(totalIncome, prevTotals.income);
    var expenseChange = pctChange(totalExpense, prevTotals.expense);

    var cardsGrid = el('div', {class:'lb-metric-grid', style:'display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px;'});
    [
      [t('ingresosTotales'), totalIncome, '#15803D', incomeChange, true],
      [t('gastosTotales'), totalExpense, '#DC2626', expenseChange, false],
      [t('ingresoNeto'), netIncome, netIncome>=0?'#000000':'#DC2626', null, null]
    ].forEach(function(p){
      var cardChildren = [
        el('p', {style:'font-size:12px; color:#6B7280; margin:0 0 6px;'}, [p[0]]),
        el('p', {class:'lb-num', style:'font-size:18px; margin:0; font-weight:600; color:'+p[2]+';'}, [fmt(p[1],state.data.baseCurrency)])
      ];
      if (p[3] !== null){
        var up = p[3] >= 0;
        var goodDirection = p[4] ? up : !up;
        var changeColor = goodDirection ? '#15803D' : '#DC2626';
        cardChildren.push(el('p', {style:'font-size:11px; margin:4px 0 0; color:'+changeColor+';'}, [(up?'\u2191 ':'\u2193 ')+Math.abs(p[3]).toFixed(0)+'% '+t('vsMesAnterior')]));
      }
      cardsGrid.appendChild(el('div', {class:'lb-card'}, cardChildren));
    });
    cardsGrid.appendChild(el('div', {class:'lb-card'}, [
      el('p', {style:'font-size:12px; color:#6B7280; margin:0 0 6px;'}, [t('tasaAhorro')]),
      el('p', {class:'lb-num', style:'font-size:18px; margin:0; font-weight:600;'}, [savingsRate.toFixed(1)+'%'])
    ]));
    container.appendChild(cardsGrid);

    var liquidBalance = d.accounts.filter(function(a){ return a.type === 'cash' || a.type === 'savings'; })
      .reduce(function(s,a){ return s + convertAmount(a.balance, a.currency, d.baseCurrency); }, 0);
    var recentMonths = [shiftMonthKey(currentKey,-1), shiftMonthKey(currentKey,-2), shiftMonthKey(currentKey,-3)];
    var avgExpense = recentMonths.reduce(function(s,k){ return s + monthTotals(k).expense; }, 0) / recentMonths.length;
    if (avgExpense > 0){
      var coverageMonths = liquidBalance / avgExpense;
      var runwayCard = el('div', {class:'lb-card', style:'margin-bottom:16px;'});
      runwayCard.appendChild(el('p', {style:'font-size:12px; color:#6B7280; margin:0 0 6px;'}, ['Colch\u00f3n de ahorro']));
      runwayCard.appendChild(el('p', {style:'font-size:14px; margin:0;'}, [
        el('span', {class:'lb-num', style:'font-weight:600;'}, [coverageMonths.toFixed(1) + ' meses']),

        if (entries.length <= max) return entries.slice();
        var kept = entries.slice(0, max-1);
        var restSum = entries.slice(max-1).reduce(function(s,e){ return s+e[1]; }, 0);
        var otrosIdx = kept.findIndex(function(e){ return e[0] === 'Otros'; });
        if (otrosIdx >= 0) kept[otrosIdx] = [kept[otrosIdx][0], kept[otrosIdx][1] + restSum];

        return kept;

  // ---- IMPORTAR (CSV o extracto PDF) ----
  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n' || c === '\r'){
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else { field += c; }
      }
    }
    if (field !== '' || row.length > 0){ row.push(field); rows.push(row); }
    if (rows.length === 0) return { fields: [], data: [] };
    var fields = rows[0].map(function(f){ return f.trim(); });
    var data = rows.slice(1).filter(function(r){ return r.some(function(v){ return v !== ''; }); }).map(function(r){
      var obj = {};
      fields.forEach(function(f, idx){ obj[f] = r[idx] !== undefined ? r[idx] : ''; });
      return obj;
    });
    return { fields: fields, data: data };
  }
  function readFileAsText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }
  function extractPdfText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        try {
          if (typeof pdfjsLib === 'undefined'){ reject(new Error('pdfjs no disponible')); return; }
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          var loadingTask = pdfjsLib.getDocument({ data: reader.result });
          loadingTask.promise.then(function(pdf){
            var pagePromises = [];
            for (var i = 1; i <= pdf.numPages; i++){
              pagePromises.push(pdf.getPage(i).then(function(page){
                return page.getTextContent().then(function(tc){
                  var lines = {};
                  tc.items.forEach(function(it){
                    var y = Math.round(it.transform[5]);
                    lines[y] = (lines[y] || '') + it.str + ' ';
                  });
                  return Object.keys(lines).sort(function(a,b){ return b-a; }).map(function(k){ return lines[k]; }).join('\n');
                });
              }));
            }
            Promise.all(pagePromises).then(function(pages){ resolve(pages.join('\n')); }).catch(reject);
          }).catch(reject);
        } catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }
  function parseStatementText(text){
    var lines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    var dateRe = /\b(\d{1,2}[\/\-\s](?:\d{1,2}|[A-Za-z]{3,9})[\/\-\s]\d{2,4})\b/;
    var amountRe = /-?\$?\d{1,3}(?:,\d{3})*\.\d{2}/g;
    var rows = [];
    lines.forEach(function(line){
      var dm = line.match(dateRe);
      if (!dm) return;
      var amounts = line.match(amountRe);
      if (!amounts || amounts.length === 0) return;
      var rawAmount = amounts[0];
      var amount = parseFloat(rawAmount.replace(/[$,]/g,''));
      if (isNaN(amount) || amount === 0) return;
      var desc = line.replace(dm[0], '').replace(rawAmount, '').replace(/\s+/g,' ').trim();
      if (desc.length > 60) desc = desc.slice(0,60);
      var isoDate = dm[0];
      var parsed = new Date(dm[0].replace(/-/g,'/'));
      if (!isNaN(parsed)) isoDate = parsed.toISOString().slice(0,10);
      rows.push({ date: isoDate, desc: desc || 'Movimiento', amount: Math.abs(amount).toFixed(2), kind: (rawAmount.indexOf('-')===0) ? 'expense' : 'income' });
    });
    return rows;
  }

    card.appendChild(baseSelect);

    card.appendChild(el('p', {style:'font-size:12px; color:#6B7280; margin:0 0 4px;'}, [t('monedaSecundaria')]));
    var secondarySelect = el('select', {class:'lb-select', style:'max-width:220px;'}, [el('option',{value:''},[t('ninguna')])].concat(CURRENCIES.filter(function(c){ return c[0] !== state.data.baseCurrency; }).map(function(c){
      var o = el('option',{value:c[0]},[c[0]+' \u2014 '+currencyDisplayName(c[0])]);
      if (c[0] === state.data.secondaryCurrency) o.setAttribute('selected','selected');
      return o;
    })));
    secondarySelect.addEventListener('change', async function(e){
      state.data.secondaryCurrency = e.target.value || null;
      if (state.data.secondaryCurrency && !state.data.rates[state.data.secondaryCurrency]){
        state.data.rates[state.data.secondaryCurrency] = 1;
      }
      render(); saveData();
    });
    card.appendChild(secondarySelect);
    container.appendChild(card);

    var ratesCard = el('div', {class:'lb-card', style:'margin-top:16px;'});
    ratesCard.appendChild(el('p', {class:'lb-serif', style:'font-size:16px; margin:0 0 8px;'}, [t('tiposDeCambio')]));
    ratesCard.appendChild(el('p', {style:'font-size:13px; color:#6B7280; margin:0 0 10px;'}, [t('tiposCambioDesc').split('{BASE}').join(state.data.baseCurrency)]));
    var currentRates = state.data.rates || {};
    Object.keys(currentRates).forEach(function(code){
      var row = el('div', {style:'display:flex; align-items:center; gap:8px; margin-bottom:8px;'});
      row.appendChild(el('span', {style:'font-size:13px; width:50px; flex-shrink:0;'}, ['1 ' + code]));
      var rInput = el('input', {class:'lb-input', type:'number', step:'0.0001', value: currentRates[code], style:'max-width:130px;'});
      row.appendChild(rInput);
      row.appendChild(el('span', {style:'font-size:12px; color:#6B7280;'}, ['= ' + state.data.baseCurrency]));
      row.appendChild(el('button', {class:'lb-btn', style:'padding:6px 12px; font-size:12px;', onclick: async function(){
        var v = parseFloat(rInput.value);
        if (!isNaN(v) && v > 0){ state.data.rates[code] = v; render(); saveData(); }
      }}, [t('guardar')]));
      if (code !== state.data.secondaryCurrency){
        row.appendChild(el('button', {class:'lb-btn-ghost lb-btn', style:'padding:6px 10px; font-size:12px;', onclick: async function(){
          var inUse = state.data.accounts.some(function(a){ return a.currency===code; }) || state.data.transactions.some(function(t){ return t.currency===code; });
          if (inUse) return;
          delete state.data.rates[code];
          render(); saveData();
        }}, [t('quitar')]));
      }
      ratesCard.appendChild(row);
    });
    var addRateSelect = el('select', {class:'lb-select', style:'max-width:200px; margin-top:6px;'}, CURRENCIES.filter(function(c){ return c[0] !== state.data.baseCurrency && !currentRates[c[0]]; }).map(function(c){ return el('option',{value:c[0]},[c[0]+' \u2014 '+currencyDisplayName(c[0])]); }));
    var addRateInput = el('input', {class:'lb-input', type:'number', step:'0.0001', placeholder:t('tipoDeCambioPlaceholder'), style:'max-width:130px; margin-top:6px;'});
    ratesCard.appendChild(el('div', {style:'display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;'}, [
      addRateSelect, addRateInput,
      el('button', {class:'lb-btn', onclick: async function(){
        var v = parseFloat(addRateInput.value);
        if (!addRateSelect.value || isNaN(v) || v <= 0) return;
        state.data.rates[addRateSelect.value] = v;
        render(); saveData();
      }}, [t('anadirMoneda')])
    ]));
    container.appendChild(ratesCard);

    var catCard = el('div', {class:'lb-card', style:'margin-top:16px;'});
    catCard.appendChild(el('p', {class:'lb-serif', style:'font-size:16px; margin:0 0 8px;'}, [t('categoriasPersonalizadas')]));
    catCard.appendChild(el('p', {style:'font-size:13px; color:#6B7280; margin:0 0 10px;'}, [t('catPersonalizadasDesc')]));
    var newCatInput = el('input', {class:'lb-input', placeholder:t('nuevaCategoria'), style:'max-width:200px; display:inline-block;'});
    catCard.appendChild(newCatInput);
    catCard.appendChild(el('button', {class:'lb-btn', style:'margin-left:10px;', onclick: async function(){
      var name = newCatInput.value.trim();
      if (!name) return;
      if (getAllCategories().indexOf(name) !== -1) return;
      state.data.customCategories.push(name);
      render(); saveData();
    }}, [t('anadir')]));
    if (state.data.customCategories.length > 0){
      var catList = el('div', {style:'margin-top:12px;'});
      state.data.customCategories.forEach(function(c){
        catList.appendChild(el('div', {style:'display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #F3F4F6;'}, [
          el('span', {style:'font-size:13px;'}, [c]),
          el('button', {class:'lb-btn-ghost lb-btn', style:'padding:3px 10px; font-size:11px;', onclick: async function(){
            state.data.customCategories = state.data.customCategories.filter(function(x){ return x !== c; });
            render(); saveData();
          }}, [t('eliminar')])
        ]));
      });
      catCard.appendChild(catList);
    }
    container.appendChild(catCard);

    var backupCard = el('div', {class:'lb-card', style:'margin-top:16px;'});
    backupCard.appendChild(el('p', {class:'lb-serif', style:'font-size:16px; margin:0 0 8px;'}, [t('copiaSeguridad')]));
    backupCard.appendChild(el('p', {style:'font-size:13px; color:#6B7280; margin:0 0 10px;'}, [t('datosSoloNavegador')]));
    var backupStatus = el('p', {style: state.backupStatusMsg ? 'font-size:12px; margin:10px 0 0; color:'+state.backupStatusMsg.color+';' : 'font-size:12px; margin:10px 0 0; display:none;'}, [state.backupStatusMsg ? state.backupStatusMsg.text : '']);
    state.backupStatusMsg = null;
    function applyImportedBackup(jsonText){
      try {
        var parsed = JSON.parse(jsonText);
        if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)){
          throw new Error(t('errorFormatoArchivo'));
        }
        parsed.accounts = Array.isArray(parsed.accounts) ? parsed.accounts : [];
        parsed.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
        parsed.budgets = Array.isArray(parsed.budgets) ? parsed.budgets : [];
        parsed.goals = Array.isArray(parsed.goals) ? parsed.goals : [];
        parsed.recurring = Array.isArray(parsed.recurring) ? parsed.recurring : [];
        parsed.debts = Array.isArray(parsed.debts) ? parsed.debts : [];
        parsed.holdings = Array.isArray(parsed.holdings) ? parsed.holdings : [];
        parsed.customCategories = Array.isArray(parsed.customCategories) ? parsed.customCategories : [];
        parsed.dashboardOrder = Array.isArray(parsed.dashboardOrder) ? parsed.dashboardOrder : ['typeBreakdown','cashflow','presupuesto','topcat','metas','recientes'];
        parsed.baseCurrency = parsed.baseCurrency || 'AUD';
        if (parsed.rate && !parsed.rates){
          parsed.rates = {};
          parsed.rates[parsed.secondaryCurrency || 'EUR'] = parsed.rate;
          parsed.secondaryCurrency = parsed.secondaryCurrency || 'EUR';
        }
        parsed.rates = (parsed.rates && typeof parsed.rates === 'object') ? parsed.rates : {};
        if (parsed.secondaryCurrency === undefined) parsed.secondaryCurrency = 'EUR';
        state.data = parsed;
        saveData();
        state.backupStatusMsg = { text: t('copiaImportadaOk'), color: '#15803D' };
        render();
      } catch(err){
        console.error('Error importando backup', err);
        state.backupStatusMsg = { text: t('noSePudoImportar'), color: '#DC2626' };
        render();
      }
    }
    backupCard.appendChild(el('div', {style:'display:flex; gap:10px; flex-wrap:wrap;'}, [
      el('button', {class:'lb-btn', onclick: function(){
        var blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'libra-backup-' + new Date().toISOString().slice(0,10) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }}, [t('exportarCopia')]),
      el('button', {class:'lb-btn-ghost lb-btn', onclick: async function(){
        var json = JSON.stringify(state.data, null, 2);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText){
            await navigator.clipboard.writeText(json);
          } else {
            var ta = document.createElement('textarea');
            ta.value = json; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.focus(); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          state.backupStatusMsg = { text: t('copiadoOk'), color: '#15803D' };
        } catch(err){
          console.error('Error copiando backup', err);
          state.backupStatusMsg = { text: t('noSePudoCopiar'), color: '#DC2626' };
        }
        render();
      }}, [t('copiarCopia')]),
      el('label', {class:'lb-btn-ghost lb-btn', style:'cursor:pointer;'}, [
        t('importarArchivo'),
        el('input', {type:'file', accept:'.json', style:'display:none;', onchange: function(e){
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(){ applyImportedBackup(reader.result); };
          reader.onerror = function(){
            backupStatus.textContent = t('noSePudoLeer');
            backupStatus.style.cssText = 'font-size:12px; margin:10px 0 0; color:#DC2626;';
          };
          reader.readAsText(file);
        }})
      ])
    ]));
    var pasteWrap = el('div', {style:'margin-top:14px; padding-top:14px; border-top:1px solid #F3F4F6;'});
    pasteWrap.appendChild(el('p', {style:'font-size:12px; color:#6B7280; margin:0 0 8px;'}, [t('pegaAquiHint')]));
    var pasteArea = el('textarea', {class:'lb-input', rows:'4', placeholder:t('pegaAquiPlaceholder'), style:'font-family:monospace; font-size:11px; resize:vertical;'});
    pasteWrap.appendChild(pasteArea);
    pasteWrap.appendChild(el('button', {class:'lb-btn-ghost lb-btn', style:'margin-top:8px;', onclick: function(){
      if (!pasteArea.value.trim()) return;
      applyImportedBackup(pasteArea.value);
    }}, [t('importarTexto')]));
    backupCard.appendChild(pasteWrap);
    backupCard.appendChild(backupStatus);
    container.appendChild(backupCard);

    var danger = el('div', {class:'lb-card', style:'margin-top:16px; border-color:#FECACA;'});
    danger.appendChild(el('p', {class:'lb-serif', style:'font-size:16px; margin:0 0 8px;'}, [t('borrarTodosDatos')]));
    danger.appendChild(el('p', {style:'font-size:13px; color:#6B7280; margin:0 0 10px;'}, [t('borrarTodosDesc')]));
    danger.appendChild(el('button', {class:'lb-btn-ghost lb-btn', onclick: async function(){ state.data = defaultData(); render(); saveData(); }}, [t('borrarTodo')]));
    container.appendChild(danger);
  }

  var FONT_SCALE = { small: 0.88, medium: 1, large: 1.22 };
  function applyFontSize(){
    var app = document.getElementById('libra-app');
    if (!app) return;
    var scale = FONT_SCALE[state.data.fontSize] || 1;
    if (scale === 1) return;
    var all = app.querySelectorAll('*');
    for (var i = 0; i < all.length; i++){
      var el = all[i];
      var fs = el.style && el.style.fontSize;
      if (!fs) continue;
      if (!el.dataset.origFontSize) el.dataset.origFontSize = fs;
      var match = /^([\d.]+)(px|em)$/.exec(el.dataset.origFontSize);
      if (!match) continue;
      var val = parseFloat(match[1]) * scale;
      el.style.fontSize = (Math.round(val * 100) / 100) + match[2];
    }
  }
  var lastRenderedTab = null;
  var wasLoading = true;
  function render(){
    renderNav();
    renderGlobalSearch();
    renderHero();
    var content = document.getElementById('lb-content');
    content.innerHTML = '';
    var isFreshTab = (state.tab !== lastRenderedTab) || wasLoading;
    lastRenderedTab = state.tab;
    wasLoading = state.loading;
    var wrap = el('div', {class: isFreshTab ? 'lb-fade-in' : ''});
    content.appendChild(wrap);
    if (state.loading){ wrap.appendChild(el('p', {style:'font-size:13px; color:#6B7280;'}, [t('cargandoDatos')])); return; }
    if (state.tab === 'dashboard') renderDashboard(wrap);
    else if (state.tab === 'cuentas') renderCuentas(wrap);
    else if (state.tab === 'transacciones') renderTransacciones(wrap);
    else if (state.tab === 'recurrentes') renderRecurrentes(wrap);
    else if (state.tab === 'cashflow') renderCashflow(wrap);
    else if (state.tab === 'gastos') renderGastos(wrap);
    else if (state.tab === 'ingresos') renderIngresos(wrap);
    else if (state.tab === 'presupuesto') renderPresupuesto(wrap);
    else if (state.tab === 'metas') renderMetas(wrap);
    else if (state.tab === 'deudas') renderDeudas(wrap);
    else if (state.tab === 'importar') renderImportar(wrap);
    else if (state.tab === 'ajustes') renderAjustes(wrap);
    renderModal();
    applyFontSize();
  }

  render();
  loadData();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){ console.error('SW registration failed', err); });
    });
  }
</script>
</body>
</html>
