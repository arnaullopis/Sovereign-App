<body style="margin:0; padding:0; background:#FFFFFF;">
<style>

  async function fetchCoinHistory(coinId, vsCurrency, days){
    var url = 'https://api.coingecko.com/api/v3/coins/'+coinId+'/market_chart?vs_currency='+vsCurrency.toLowerCase()+'&days='+days;
    var res = await fetch(url);
    if (!res.ok) throw new Error('CoinGecko historial respondi\u00f3 con error '+res.status);
    var data = await res.json();
    var points = (data.prices || []).map(function(p){ return { t: p[0], p: p[1] }; });
    var maxPoints = 180;
    if (points.length > maxPoints){
      var step = Math.ceil(points.length / maxPoints);
      var sampled = [];
      for (var i = 0; i < points.length; i += step){ sampled.push(points[i]); }
      if (sampled[sampled.length-1] !== points[points.length-1]) sampled.push(points[points.length-1]);
      points = sampled;
    }
    return points;
  }
  function svgSparkline(prices, color){
    if (!prices || prices.length < 2) return '';
    var W = 120, H = 36;
    var min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
    var range = max - min || 1;
    var points = prices.map(function(p, i){
      var x = (i/(prices.length-1)) * W;
      var y = H - ((p-min)/range) * (H-4) - 2;
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:100%; display:block;"><polyline points="'+points+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

      var idx = Math.abs(hash) % CHART_COLORS.length;
      var tries = 0;
      while (used[idx] && tries < CHART_COLORS.length){

      result[name] = CHART_COLORS[idx];
    });
    return result;
  }

  function addInterval(dateStr, freq){

  function generateDueRecurring(){
    var d = state.data, today = new Date().toISOString().slice(0,10), changed = false;
    (d.recurring || []).forEach(function(rec){
      if (!rec.active) return;
      var next = rec.lastGenerated ? addInterval(rec.lastGenerated, rec.frequency) : rec.startDate;
      var guard = 0;
      while (next <= today && guard < 60){
        var tr = { id: uid(), date: next, desc: rec.desc, amount: rec.amount, currency: rec.currency, kind: rec.kind, category: rec.category, accountId: rec.accountId || null, goalId: rec.goalId || null, recurringId: rec.id };
        d.transactions.unshift(tr);
        applyTxToAccount(tr, 1);
        applyTxToGoal(tr, 1);
        rec.lastGenerated = next;
        next = addInterval(next, rec.frequency);
        changed = true;
        guard++;
      }
    });
    return changed;
  }

  var libraDB = (function(){
    var dbPromise = null;
    function openDB(){
      if (dbPromise) return dbPromise;
      dbPromise = new Promise(function(resolve, reject){
        if (typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB no disponible')); return; }
        var req = indexedDB.open('libra-db', 1);
        req.onupgradeneeded = function(e){
          var db = e.target.result;
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        };
        req.onsuccess = function(e){ resolve(e.target.result); };
        req.onerror = function(e){ reject(e.target.error); };
      });
      return dbPromise;
    }
    var idb = {
      get: function(key){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readonly');
            var req = tx.objectStore('kv').get(key);
            req.onsuccess = function(){ resolve(req.result === undefined ? null : { key: key, value: req.result }); };
            req.onerror = function(){ reject(req.error); };
          });
        });
      },
      set: function(key, value){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').put(value, key);
            tx.oncomplete = function(){ resolve({ key: key, value: value }); };
            tx.onerror = function(){ reject(tx.error); };
          });
        });
      },
      delete: function(key){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').delete(key);
            tx.oncomplete = function(){ resolve({ key: key, deleted: true }); };
            tx.onerror = function(){ reject(tx.error); };
          });
        });
      },
      list: function(prefix){
        return openDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction('kv', 'readonly');
            var req = tx.objectStore('kv').getAllKeys();
            req.onsuccess = function(){
              var keys = req.result.filter(function(k){ return !prefix || String(k).indexOf(prefix) === 0; });
              resolve({ keys: keys });
            };
            req.onerror = function(){ reject(req.error); };
          });
        });
      }
    };
    // Use Claude's artifact storage when available (inside claude.ai); otherwise fall back to IndexedDB
    // (e.g. when the file is opened directly in a browser, or installed as a standalone/Mac/Android app).
    var useClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);
    return {
      get: function(key){ return useClaudeStorage ? window.storage.get(key) : idb.get(key); },
      set: function(key, value){ return useClaudeStorage ? window.storage.set(key, value) : idb.set(key, value); },
      delete: function(key){ return useClaudeStorage ? window.storage.delete(key) : idb.delete(key); },
      list: function(prefix){ return useClaudeStorage ? window.storage.list(prefix) : idb.list(prefix); }
    };
  })();

  function computeNetWorthSeries(days){
    var d = state.data;
    var today = new Date();
    var series = [];
    // Precompute per-account transactions sorted by date (only linked ones affect reconstruction)
    var txByAccount = {};
    d.transactions.forEach(function(tr){
      if (!tr.accountId) return;
      (txByAccount[tr.accountId] = txByAccount[tr.accountId] || []).push(tr);
    });
    for (var i = days; i >= 0; i--){
      var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var dateStr = dt.toISOString().slice(0,10);
      var total = 0;
      d.accounts.forEach(function(a){
        var bal = a.balance;
        var txs = txByAccount[a.id] || [];
        txs.forEach(function(tr){
          if (tr.date > dateStr){
            var effect = (tr.kind === 'income' ? 1 : -1) * convertAmount(tr.amount, tr.currency, a.currency, d.rate);
            bal -= effect;
          }
        });
        total += convertAmount(bal, a.currency, d.baseCurrency);
      });
      series.push({ date: dateStr, value: Math.round(total*100)/100 });
    }
    return series;
  }

  function incomeByCategoryPerMonth(months){
    var d = state.data, now = new Date();
    var keys = [];
    for (var i = months-1; i >= 0; i--){
      var dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'));
    }
    var byCat = {}, totalsByCat = {};
    d.transactions.forEach(function(tr){
      if (tr.kind !== 'income' || tr.isTransfer) return;
      var idx = keys.indexOf(monthKey(tr.date));
      if (idx === -1) return;
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      byCat[tr.category] = byCat[tr.category] || new Array(months).fill(0);
      byCat[tr.category][idx] += v;
      totalsByCat[tr.category] = (totalsByCat[tr.category]||0) + v;
    });
    var categories = Object.keys(totalsByCat).sort(function(a,b){ return totalsByCat[b]-totalsByCat[a]; });
    return { labels: keys.map(monthLabel), categories: categories, data: byCat };
  }
  function squarifyRow(row, side){
    var sum = row.reduce(function(s,r){ return s+r.area; }, 0);
    var maxA = Math.max.apply(null, row.map(function(r){ return r.area; }));
    var minA = Math.min.apply(null, row.map(function(r){ return r.area; }));
    if (minA <= 0) return Infinity;
    return Math.max((side*side*maxA)/(sum*sum), (sum*sum)/(side*side*minA));
  }
  function squarify(items, x, y, w, h){
    var result = [];
    var remaining = items.slice();
    while (remaining.length){
      var shortSide = Math.min(w, h);
      var row = [remaining[0]];
      var rowArea = remaining[0].area;
      var bestRatio = squarifyRow(row, shortSide);
      var i = 1;
      while (i < remaining.length){
        var testRow = row.concat([remaining[i]]);
        var testArea = rowArea + remaining[i].area;
        var testRatio = squarifyRow(testRow, shortSide);
        if (testRatio <= bestRatio){ row = testRow; rowArea = testArea; bestRatio = testRatio; i++; }
        else break;
      }
      var rowLen = rowArea / shortSide;
      if (w >= h){
        var cy = y;
        row.forEach(function(it){
          var itH = it.area / rowLen;
          it.x = x; it.y = cy; it.w = rowLen; it.h = itH;
          cy += itH;
        });
        x += rowLen; w -= rowLen;
      } else {
        var cx = x;
        row.forEach(function(it){
          var itW = it.area / rowLen;
          it.x = cx; it.y = y; it.w = itW; it.h = rowLen;
          cx += itW;
        });
        y += rowLen; h -= rowLen;
      }
      result = result.concat(row);

  function monthlyFlows(months){
    var d = state.data, now = new Date();
    var keys = [];
    for (var i = months-1; i >= 0; i--){
      var dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'));
    }
    var map = {};
    keys.forEach(function(k){ map[k] = { income:0, expense:0 }; });
    d.transactions.forEach(function(tr){
      if (tr.isTransfer) return;
      if (state.accountFilter && tr.accountId !== state.accountFilter) return;
      var k = monthKey(tr.date);
      if (map[k] === undefined) return;
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      if (tr.kind === 'income') map[k].income += v; else map[k].expense += v;
    });
    return keys.map(function(k){ return { key:k, label: monthLabel(k), income: map[k].income, expense: map[k].expense, net: map[k].income - map[k].expense }; });
  }

  function monthTotals(monthKeyStr){
    var d = state.data, income = 0, expense = 0;
    d.transactions.forEach(function(tr){
      if (tr.isTransfer || monthKey(tr.date) !== monthKeyStr) return;
      if (state.accountFilter && tr.accountId !== state.accountFilter) return;

  function budgetAvailable(b){
    if (!b.rollover) return b.limit;
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    var start = b.startMonth || currentKey;
    var cursor = new Date(start + '-01T00:00:00');
    var carry = 0, guard = 0;
    while (true){
      var key = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0');
      if (key >= currentKey || guard > 60) break;
      carry += (b.limit - categorySpendForMonth(b.category, key));
      cursor.setMonth(cursor.getMonth() + 1);
      guard++;
    }
    return b.limit + carry;
  }

  function netWorthGeometry(series){
    var W = 680, H = 230, padL = 54, padR = 10, padT = 14, padB = 26;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var vals = series.map(function(p){ return p.value; });
    var maxV = Math.max.apply(null, vals), minV = Math.min.apply(null, vals);
    var range = maxV - minV || 1;
    var padRange = range * 0.12;
    maxV += padRange; minV -= padRange;
    var n = series.length || 1;
    function x(i){ return padL + (i/(n-1||1)) * innerW; }
    function y(v){ return padT + innerH - ((v-minV)/(maxV-minV)) * innerH; }
    return { W:W, H:H, padL:padL, padR:padR, padT:padT, padB:padB, innerW:innerW, innerH:innerH, minV:minV, maxV:maxV, n:n, x:x, y:y };
  }

  function svgAreaChart(series){
    var geo = netWorthGeometry(series);
    var W=geo.W, H=geo.H, padL=geo.padL, padR=geo.padR, padT=geo.padT, innerH=geo.innerH, minV=geo.minV, maxV=geo.maxV, n=geo.n, x=geo.x, y=geo.y;

    var pts = series.map(function(p,i){ return [x(i), y(p.value)]; });
    function smoothPath(points){
      if (points.length < 2) return '';
      var d = 'M'+points[0][0].toFixed(1)+','+points[0][1].toFixed(1);
      for (var i = 0; i < points.length - 1; i++){
        var p0 = points[i === 0 ? 0 : i-1];
        var p1 = points[i];
        var p2 = points[i+1];
        var p3 = points[i+2 < points.length ? i+2 : i+1];
        var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
        var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
        d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
      }
      return d;
    }
    var linePath = smoothPath(pts);
    var areaPath = linePath + ' L'+x(n-1).toFixed(1)+','+(padT+innerH).toFixed(1) + ' L'+x(0).toFixed(1)+','+(padT+innerH).toFixed(1) + ' Z';

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:100%; display:block; overflow:visible;">';
    svg += '<defs><linearGradient id="lbAreaGrad" x1="0" y1="0" x2="0" y2="1">';
    svg += '<stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28"/>';
    svg += '<stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.02"/></linearGradient></defs>';
    [minV, (minV+maxV)/2, maxV].forEach(function(v){
      var yy = y(v);
      svg += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#F3F4F6" stroke-width="1"/>';
      svg += '<text x="4" y="'+(yy+3).toFixed(1)+'" font-size="9" fill="#6B7280">'+fmt(v,state.data.baseCurrency)+'</text>';
    });
    svg += '<path d="'+areaPath+'" fill="url(#lbAreaGrad)"/>';
    svg += '<path d="'+linePath+'" fill="none" stroke="#0EA5E9" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>';
    var step = Math.max(1, Math.floor((n-1)/6));
    for (var i = 0; i < n; i += step){
      svg += '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#6B7280" text-anchor="middle">'+shortDayLabel(series[i].date)+'</text>';
    }
    // hover elements (hidden by default, positioned/shown via JS)
    svg += '<line class="lb-nw-hoverline" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+innerH)+'" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="3,3" opacity="0" style="transition:x1 .18s cubic-bezier(.22,.9,.34,1), x2 .18s cubic-bezier(.22,.9,.34,1), opacity .15s;"/>';
    svg += '<circle class="lb-nw-hoverdot" cx="0" cy="0" r="4.5" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2" opacity="0" style="transition:cx .18s cubic-bezier(.22,.9,.34,1), cy .18s cubic-bezier(.22,.9,.34,1), opacity .15s;"/>';
    svg += '<rect class="lb-nw-capture" x="'+padL+'" y="0" width="'+(W-padL-padR)+'" height="'+H+'" fill="transparent" style="cursor:crosshair;"/>';
    svg += '</svg>';
    return svg;
  }

  function renderDoughnut(entries, colors){
    var wrap = el('div', {style:'display:flex; align-items:center; justify-content:center; height:100%; position:relative; padding:10px 0;'});
    var total = entries.reduce(function(s,e){ return s+e[1]; }, 0);
    if (total <= 0){
      wrap.appendChild(el('p', {style:'font-size:12px; color:var(--lb-text-muted);'}, [t('sinDatos')]));
      return wrap;
    }
    var size = 300, cx = size/2, cy = size/2 - 6, r = 66, explode = 9, depth = 7;
    var colorMap = assignDistinctColors(entries.map(function(e){ return e[0]; }));
    function polar(angleDeg, radius, ox, oy){
      var a = (angleDeg - 90) * Math.PI / 180;
      return [ox + radius * Math.cos(a), oy + radius * Math.sin(a)];
    }
    var acc = 0;
    var slices = entries.map(function(e, i){
      var startAngle = acc / total * 360;
      acc += e[1];
      var endAngle = acc / total * 360;
      var midAngle = (startAngle + endAngle) / 2;
      var gap = entries.length > 1 ? 1.2 : 0;
      var a0 = startAngle + gap, a1 = endAngle - gap;
      var dir = polar(midAngle, 1, 0, 0);
      var ox = cx + dir[0]*explode, oy = cy + dir[1]*explode;
      var p0 = polar(a0, r, ox, oy), p1 = polar(a1, r, ox, oy);
      var largeArc = (a1 - a0) > 180 ? 1 : 0;
      var path = 'M'+ox+','+oy+' L'+p0[0]+','+p0[1]+' A'+r+','+r+' 0 '+largeArc+',1 '+p1[0]+','+p1[1]+' Z';
      var labelPt = polar(midAngle, r + explode + 26, cx, cy);
      var edgePt = polar(midAngle, r + explode, ox, oy);
      return { e:e, i:i, path:path, ox:ox, oy:oy, color: colorMap[e[0]], labelPt:labelPt, edgePt:edgePt, midAngle:midAngle, pct: e[1]/total*100 };
    });

    var svg = '<svg viewBox="-100 0 '+(size+200)+' '+size+'" style="width:100%; height:auto; overflow:visible; display:block;">';
    svg += '<defs>';
    svg += '<filter id="lbPieShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.18"/></filter>';
    slices.forEach(function(s){
      var lighter = shadeColor(s.color, 0.08);
      var darker = shadeColor(s.color, -0.12);
      svg += '<linearGradient id="lbPieGrad'+s.i+'" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="'+lighter+'"/><stop offset="100%" stop-color="'+darker+'"/></linearGradient>';
    });
    svg += '</defs>';
    svg += '<g class="lb-pie3d-group" style="transform-origin:'+cx+'px '+cy+'px; transform:scale(0.7); opacity:0; transition:transform .5s cubic-bezier(.22,1.2,.36,1), opacity .4s ease;">';
    // depth/base layer first (darker, shifted down) for a 3D thickness illusion
    slices.forEach(function(s){
      svg += '<path d="'+s.path+'" transform="translate(0,'+depth+')" fill="'+shadeColor(s.color,-0.12)+'" opacity="0.6" stroke="#FFFFFF" stroke-width="1"/>';
    });
    // top faces
    slices.forEach(function(s){
      svg += '<path class="lb-pie3d-seg" data-idx="'+s.i+'" d="'+s.path+'" fill="url(#lbPieGrad'+s.i+')" stroke="#FFFFFF" stroke-width="1.5" filter="url(#lbPieShadow)" style="cursor:pointer; transition:opacity .15s, filter .15s;"/>';
    });
    // leader lines + labels for the top 5 categories only, to keep it legible
    var labeled = slices.slice(0, 5);
    var leftLabels = labeled.filter(function(s){ return s.labelPt[0] < cx; }).sort(function(a,b){ return a.labelPt[1]-b.labelPt[1]; });
    var rightLabels = labeled.filter(function(s){ return s.labelPt[0] >= cx; }).sort(function(a,b){ return a.labelPt[1]-b.labelPt[1]; });
    var minGap = 22;
    function resolveColumn(list, labelX){
      if (list.length) list[0].finalY = list[0].labelPt[1];
      for (var i = 1; i < list.length; i++){
        var prevY = list[i-1].finalY;
        if (list[i].labelPt[1] - prevY < minGap){
          list[i].finalY = prevY + minGap;
        } else {
          list[i].finalY = list[i].labelPt[1];
        }
      }
      list.forEach(function(s){ s.finalX = labelX; });
    }
    resolveColumn(leftLabels, -(r + explode + 30) + cx);
    resolveColumn(rightLabels, (r + explode + 30) + cx);
    leftLabels.concat(rightLabels).forEach(function(s){
      var anchor = s.finalX < cx ? 'end' : 'start';
      var dx = s.finalX < cx ? -4 : 4;
      svg += '<line x1="'+s.edgePt[0]+'" y1="'+s.edgePt[1]+'" x2="'+s.finalX+'" y2="'+s.finalY+'" stroke="#D1D5DB" stroke-width="1"/>';
      svg += '<circle cx="'+s.finalX+'" cy="'+s.finalY+'" r="2.5" fill="'+s.color+'"/>';
      svg += '<text x="'+(s.finalX+dx)+'" y="'+(s.finalY-4)+'" font-size="10" font-weight="600" fill="#111827" text-anchor="'+anchor+'">'+s.e[0]+'</text>';
      svg += '<text x="'+(s.finalX+dx)+'" y="'+(s.finalY+8)+'" font-size="9" fill="#9CA3AF" text-anchor="'+anchor+'">'+s.pct.toFixed(1)+'%</text>';
    });
    svg += '</g></svg>';

    var chartWrap = el('div', {style:'position:relative; width:100%;', html: svg});
    wrap.appendChild(chartWrap);

    var tooltip = el('div', {style:'position:absolute; display:none; pointer-events:none; background:#000000; color:#FFFFFF; padding:7px 11px; border-radius:8px; font-size:11px; white-space:nowrap; z-index:5; box-shadow:0 4px 10px rgba(0,0,0,0.15); transform:translate(-50%,-115%);'});
    wrap.style.position = 'relative';
    wrap.appendChild(tooltip);

    setTimeout(function(){
      var group = chartWrap.querySelector('.lb-pie3d-group');
      if (group) group.style.cssText += 'transform:scale(1); opacity:1;';
    }, 30);

    var segs = chartWrap.querySelectorAll('.lb-pie3d-seg');
    segs.forEach(function(seg){
      var idx = parseInt(seg.getAttribute('data-idx'), 10);
      var s = slices[idx];
      seg.addEventListener('mouseenter', function(){
        segs.forEach(function(x){ x.style.opacity = '0.4'; });
        seg.style.opacity = '1';
        seg.style.filter = 'brightness(1.08)';
        var rect = seg.getBoundingClientRect();
        var wrapRect = chartWrap.getBoundingClientRect();
        tooltip.innerHTML = '<div style="font-weight:600;">'+s.e[0]+'</div><div style="opacity:0.75; font-size:10px;">'+fmt(s.e[1],state.data.baseCurrency)+' \u00b7 '+s.pct.toFixed(1)+'%</div>';
        tooltip.style.left = (rect.left - wrapRect.left + rect.width/2) + 'px';
        tooltip.style.top = (rect.top - wrapRect.top) + 'px';
        tooltip.style.display = 'block';
      });
      seg.addEventListener('mouseleave', function(){
        segs.forEach(function(x){ x.style.opacity = '1'; x.style.filter = 'none'; });
        tooltip.style.display = 'none';
      });
    });
    return wrap;
  }

  function attachCryptoChartHover(wrapper, history, pts, geo){
    var svgEl = wrapper.querySelector('svg');
    var capture = wrapper.querySelector('.lb-crypto-capture');
    var hoverLine = wrapper.querySelector('.lb-crypto-hoverline');
    var hoverDot = wrapper.querySelector('.lb-crypto-hoverdot');
    if (!svgEl || !capture) return;
    var tooltip = el('div', {style:'position:absolute; display:none; pointer-events:none; background:#000000; color:#FFFFFF; padding:6px 10px; border-radius:8px; font-size:11px; white-space:nowrap; transform:translate(-50%,-115%); z-index:5; box-shadow:0 4px 10px rgba(0,0,0,0.15); transition:left .12s, top .12s;'});
    wrapper.appendChild(tooltip);

    function handleMove(clientX){
      var rect = svgEl.getBoundingClientRect();
      var relX = (clientX - rect.left) / rect.width * geo.W;
      var idx = Math.round((relX - geo.padL) / geo.innerW * (history.length - 1));
      idx = Math.max(0, Math.min(history.length - 1, idx));
      var px = pts[idx][0], py = pts[idx][1];
      hoverLine.setAttribute('x1', px); hoverLine.setAttribute('x2', px); hoverLine.setAttribute('opacity', '1');
      hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py); hoverDot.setAttribute('opacity', '1');
      var pxPixels = (px / geo.W) * rect.width;
      var pyPixels = (py / geo.H) * rect.height;
      tooltip.innerHTML = '<div style="font-weight:600;">'+fmt(history[idx].p, state.data.baseCurrency)+'</div><div style="opacity:0.7; font-size:10px;">'+new Date(history[idx].t).toLocaleDateString()+'</div>';
      tooltip.style.left = pxPixels + 'px';
      tooltip.style.top = pyPixels + 'px';
      tooltip.style.display = 'block';
    }
    function handleLeave(){
      hoverLine.setAttribute('opacity', '0');
      hoverDot.setAttribute('opacity', '0');
      tooltip.style.display = 'none';
    }
    capture.addEventListener('mousemove', function(e){ handleMove(e.clientX); });
    capture.addEventListener('mouseleave', handleLeave);
    capture.addEventListener('touchmove', function(e){ if (e.touches[0]){ handleMove(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});
    capture.addEventListener('touchend', handleLeave);
  }
  var CRYPTO_PERIODS = [
    {days: 1, label: '1D'},
    {days: 7, label: '1S'},
    {days: 30, label: '1M'},
    {days: 90, label: '3M'},
    {days: 365, label: '1A'},
    {days: 'max', label: 'Todo'}
  ];
  function renderCryptoDetailModal(coinId){
    var coin = POPULAR_COINS.find(function(c){ return c.id === coinId; }) || {name:coinId, symbol:coinId};
    var days = state.cryptoDetailDays || 30;
    var cacheKey = coinId + '_' + days;
    var history = state.cryptoHistory[cacheKey];
    var body = [];
    var currentPeriod = CRYPTO_PERIODS.find(function(p){ return p.days === days; });

    if (!history && !state.cryptoHistoryFetching[cacheKey]){
      state.cryptoHistoryFetching[cacheKey] = true;
      fetchCoinHistory(coinId, state.data.baseCurrency, days).then(function(hist){
        state.cryptoHistory[cacheKey] = hist;
        state.cryptoHistoryFetching[cacheKey] = false;
        renderModal();
      }).catch(function(err){
        console.error('Error al consultar historial de '+coinId, err);
        state.cryptoHistoryFetching[cacheKey] = false;
        renderModal();
      });
    }

    var periodRow = el('div', {style:'display:inline-flex; gap:2px; margin:10px 0 14px; flex-wrap:wrap; background:var(--lb-bg-alt); border-radius:11px; padding:3px;'}, CRYPTO_PERIODS.map(function(p){
      return el('button', {
        class: 'lb-segment-btn' + (days === p.days ? ' active' : ''),
        style: 'padding:5px 10px; font-size:12px;',
        onclick: function(){ state.cryptoDetailDays = p.days; renderModal(); }
      }, [p.label]);
    }));

    if (!history || history.length < 2){
      body.push(periodRow);
      body.push(el('p', {style:'font-size:13px; color:var(--lb-text-muted);'}, [t('consultandoPrecios')]));
      var loadingModal = modalShell(coin.name + ' (' + coin.symbol + ')', body);
      var loadingPanel = loadingModal.querySelector('.lb-modal-panel');
      if (loadingPanel) loadingPanel.style.maxWidth = '620px';
      return loadingModal;
    }

    var prices = history.map(function(pt){ return pt.p; });
    var min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
    var range = max - min || 1;
    var trendUp = prices[prices.length-1] >= prices[0];
    var color = trendUp ? '#15803D' : '#DC2626';
    var W = 560, H = 220, padL = 60, padR = 16, padT = 16, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var pts = history.map(function(pt, i){
      var x = padL + (i/(history.length-1)) * innerW;
      var y = padT + innerH - ((pt.p - min)/range) * innerH;
      return [x, y];
    });
    var linePath = 'M' + pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' L');
    var areaPath = linePath + ' L'+pts[pts.length-1][0].toFixed(1)+','+(padT+innerH) + ' L'+pts[0][0].toFixed(1)+','+(padT+innerH)+' Z';
    var startDate = new Date(history[0].t).toLocaleDateString();
    var endDate = new Date(history[history.length-1].t).toLocaleDateString();

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; display:block;">';
    svg += '<defs><linearGradient id="lbCryptoAreaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.22"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>';
    svg += '<line x1="'+padL+'" y1="'+padT+'" x2="'+(padL+innerW)+'" y2="'+padT+'" stroke="#F3F4F6"/>';
    svg += '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(padL+innerW)+'" y2="'+(padT+innerH)+'" stroke="#F3F4F6"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(padT+4)+'" font-size="11" fill="#9CA3AF" text-anchor="end">'+fmt(max, state.data.baseCurrency)+'</text>';
    svg += '<text x="'+(padL-8)+'" y="'+(padT+innerH+4)+'" font-size="11" fill="#9CA3AF" text-anchor="end">'+fmt(min, state.data.baseCurrency)+'</text>';
    svg += '<path d="'+areaPath+'" fill="url(#lbCryptoAreaGrad)"/>';
    svg += '<path d="'+linePath+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>';
    svg += '<line class="lb-crypto-hoverline" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+innerH)+'" stroke="'+color+'" stroke-width="1" stroke-dasharray="3,3" opacity="0" style="transition:x1 .12s, x2 .12s, opacity .12s;"/>';
    svg += '<circle class="lb-crypto-hoverdot" cx="0" cy="0" r="4.5" fill="'+color+'" stroke="#FFFFFF" stroke-width="2" opacity="0" style="transition:cx .12s, cy .12s, opacity .12s;"/>';
    svg += '<rect class="lb-crypto-capture" x="'+padL+'" y="0" width="'+innerW+'" height="'+H+'" fill="transparent" style="cursor:crosshair;"/>';
    svg += '<text x="'+padL+'" y="'+(H-6)+'" font-size="10" fill="#9CA3AF" text-anchor="start">'+startDate+'</text>';
    svg += '<text x="'+(padL+innerW)+'" y="'+(H-6)+'" font-size="10" fill="#9CA3AF" text-anchor="end">'+endDate+'</text>';
    svg += '</svg>';

    body.push(el('p', {class:'lb-num', style:'font-size:24px; font-weight:700; margin:0 0 4px;'}, [fmt(prices[prices.length-1], state.data.baseCurrency)]));
    body.push(el('p', {style:'font-size:12px; color:'+color+'; margin:0;'}, [(trendUp?'+':'')+((prices[prices.length-1]-prices[0])/prices[0]*100).toFixed(1)+'% \u00b7 ' + (currentPeriod ? currentPeriod.label : '')]));
    body.push(periodRow);
    var chartWrap = el('div', {style:'position:relative;', html: svg});
    attachCryptoChartHover(chartWrap, history, pts, {padL:padL, innerW:innerW, W:W, H:H});
    body.push(chartWrap);
    var modal = modalShell(coin.name + ' (' + coin.symbol + ')', body);
    var panel = modal.querySelector('.lb-modal-panel');
    if (panel) panel.style.maxWidth = '620px';
    return modal;
  }

  function renderModal(){

    var d = state.detail;

    else if (d.type === 'debt') item = state.data.debts.find(function(x){ return x.id === d.id; });

  // ---- DASHBOARD ----
  function titleLink(text, tab){

  var WIDGET_SUMMARY = {
    cashflow: function(){
      var now = new Date();
      var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
      var mt = monthTotals(currentKey);
      var net = mt.income - mt.expense;
      return (net >= 0 ? '+' : '') + fmt(net, state.data.baseCurrency) + ' ' + t('esteMs').toLowerCase();
    },
    presupuesto: function(){
      if (state.data.budgets.length === 0) return t('sinPresupuesto');
      var spentByCat = categoryTotals('expense', 1);
      var totalSpent = 0, totalAvail = 0;
      state.data.budgets.forEach(function(b){ totalSpent += spentByCat[b.category] || 0; totalAvail += budgetAvailable(b); });
      return fmt(totalSpent, state.data.baseCurrency) + ' / ' + fmt(totalAvail, state.data.baseCurrency);
    },
    topcat: function(){
      var spentByCat = categoryTotals('expense', 1);
      var entries = Object.keys(spentByCat).map(function(k){ return [k, spentByCat[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
      if (entries.length === 0) return t('sinGastosMes');
      return entries[0][0] + ' \u00b7 ' + fmt(entries[0][1], state.data.baseCurrency);
    },
    metas: function(){
      var active = state.data.goals.filter(function(g){ return !g.archived; });
      if (active.length === 0) return t('sinMetas');
      return active.length + ' ' + (active.length === 1 ? t('metaActiva') : t('metasActivas'));
    },
    recientes: function(){
      if (state.data.transactions.length === 0) return t('sinMovimientos');
      var tr = state.data.transactions[0];
      var sign = tr.kind === 'income' ? '+' : '\u2212';
      return tr.desc + ' \u00b7 ' + sign + fmt(tr.amount, tr.currency);
    }
  };
  var DASHBOARD_WIDGETS = {

  function renderDashboard(container){
    var totals = computeTotals();
    var stripRow = el('div', {style:'display:flex; gap:12px; margin:-14px -4px -4px; padding:14px 4px 20px; flex-wrap:nowrap; overflow-x:auto;'});

        dualNode(totals.byType[p[0]], null, '19px')
      ]));
    });
    container.appendChild(stripRow);

    var widgetsWrap = el('div', {style:'position:relative;'});
    container.appendChild(widgetsWrap);

    var order = (state.data.dashboardOrder || Object.keys(DASHBOARD_WIDGETS)).slice();
    var widgetEls = {};
    var widgetSizes = {};
    var draggedId = null;

    order.forEach(function(widgetId){
      var builder = DASHBOARD_WIDGETS[widgetId];
      if (!builder) return;
      var size = state.data.widgetSize[widgetId] || 'full';
      widgetSizes[widgetId] = size;
      var wrap = el('div', {class:'lb-widget', style:'position:absolute; transition: left .18s, top .18s, width .18s;', draggable:'true', 'data-widget-id': widgetId});
      var grip = el('div', {class:'lb-widget-grip'}, [el('span',{}),el('span',{}),el('span',{})]);
      wrap.appendChild(grip);
      var card = builder();
      var isCollapsed = !!state.data.collapsedWidgets[widgetId];
      if (widgetId !== 'typeBreakdown' && card.children.length > 1){
        var header = card.children[0];
        var restChildren = [].slice.call(card.children, 1);
        var restWrap = el('div', {style: isCollapsed ? 'display:none;' : ''});
        restChildren.forEach(function(c){ restWrap.appendChild(c); });
        var summaryFn = WIDGET_SUMMARY[widgetId];
        var summaryLine = summaryFn ? el('p', {style: isCollapsed ? 'font-size:12px; color:var(--lb-text-muted); margin:2px 0 0;' : 'display:none;'}, [summaryFn()]) : null;
        var collapseBtn = el('button', {class:'lb-widget-collapse-btn', 'aria-label': t('plegar'), style:'position:absolute; top:16px; right:44px; background:none; border:none; cursor:pointer; padding:4px; color:var(--lb-text-faint);', onclick: function(){
          state.data.collapsedWidgets[widgetId] = !state.data.collapsedWidgets[widgetId];
          render(); saveData();
        }}, [el('div', {html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .2s; transform:rotate('+(isCollapsed?'180':'0')+'deg);"><polyline points="18 15 12 9 6 15"/></svg>'})]);
        card.style.position = 'relative';
        card.insertBefore(collapseBtn, card.firstChild);
        if (summaryLine) card.appendChild(summaryLine);
        card.appendChild(restWrap);
      }
      card.style.position = 'relative';
      var expandIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
      var shrinkIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
      var sizeBtn = el('button', {class:'lb-widget-size-btn', 'aria-label': t('cambiarTamano'), style:'position:absolute; top:16px; right:16px; background:none; border:none; cursor:pointer; padding:4px; color:var(--lb-text-faint);', onclick: function(){
        state.data.widgetSize[widgetId] = size === 'half' ? 'full' : 'half';
        render(); saveData();
      }}, [el('div', {html: size === 'half' ? expandIcon : shrinkIcon})]);
      card.insertBefore(sizeBtn, card.firstChild);
      wrap.appendChild(card);
      widgetsWrap.appendChild(wrap);
      widgetEls[widgetId] = wrap;

      wrap.addEventListener('dragstart', function(e){
        draggedId = widgetId;
        wrap.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      wrap.addEventListener('dragend', function(){ wrap.classList.remove('dragging'); draggedId = null; commitOrder(); });
      wrap.addEventListener('dragover', function(e){
        e.preventDefault();
        if (draggedId && draggedId !== widgetId) reorderTo(widgetId);
      });
      grip.addEventListener('touchstart', function(e){
        draggedId = widgetId;
        wrap.classList.add('dragging');
        e.preventDefault();
      }, {passive:false});
      grip.addEventListener('touchmove', function(e){
        e.preventDefault();
        var touch = e.touches[0];
        var target = document.elementFromPoint(touch.clientX, touch.clientY);
        var targetWrap = target && target.closest ? target.closest('.lb-widget') : null;
        var targetId = targetWrap ? targetWrap.getAttribute('data-widget-id') : null;
        if (targetId && targetId !== draggedId) reorderTo(targetId);
      }, {passive:false});
      grip.addEventListener('touchend', function(){ wrap.classList.remove('dragging'); draggedId = null; commitOrder(); });
      grip.addEventListener('touchcancel', function(){ wrap.classList.remove('dragging'); draggedId = null; commitOrder(); });
    });

    function reorderTo(targetId){
      var fromIdx = order.indexOf(draggedId);
      var toIdx = order.indexOf(targetId);
      if (fromIdx === -1 || toIdx === -1) return;
      order.splice(fromIdx, 1);
      order.splice(toIdx, 0, draggedId);
      layoutMasonry();
    }
    function commitOrder(){
      state.data.dashboardOrder = order;
      saveData();
    }

    function layoutMasonry(){
      var containerWidth = widgetsWrap.getBoundingClientRect().width;
      if (!containerWidth) return;
      var gap = 16;
      var singleCol = containerWidth < 520;
      var colWidth = singleCol ? containerWidth : (containerWidth - gap) / 2;
      order.forEach(function(widgetId){
        var wrap = widgetEls[widgetId];
        if (!wrap) return;
        var isFull = singleCol || widgetSizes[widgetId] === 'full';
        wrap.style.width = (isFull ? containerWidth : colWidth) + 'px';
      });
      var colHeights = [0, 0];
      order.forEach(function(widgetId){
        var wrap = widgetEls[widgetId];
        if (!wrap) return;
        var isFull = singleCol || widgetSizes[widgetId] === 'full';
        var h = wrap.getBoundingClientRect().height || wrap.offsetHeight;
        if (isFull){
          var y = Math.max(colHeights[0], colHeights[1]);
          wrap.style.left = '0px';
          wrap.style.top = y + 'px';
          colHeights[0] = colHeights[1] = y + h + gap;
        } else {
          var col = colHeights[0] <= colHeights[1] ? 0 : 1;
          var x = col === 0 ? 0 : (colWidth + gap);
          wrap.style.left = x + 'px';
          wrap.style.top = colHeights[col] + 'px';
          colHeights[col] += h + gap;
        }
      });
      widgetsWrap.style.height = Math.max(colHeights[0], colHeights[1], gap) - gap + 'px';
    }
    layoutMasonry();
    currentMasonryLayoutFn = layoutMasonry;
  }

        }
        var color = tr.kind === 'income' ? '#15803D' : '#DC2626';
        var sign = tr.kind === 'income' ? '+' : '\u2212';
        var rowChildren = [];
        if (state.txSelectMode){
          var checked = !!state.txSelected[tr.id];
          rowChildren.push(el('input', {type:'checkbox', checked: checked ? 'checked' : undefined, style:'width:16px; height:16px; margin-right:8px; accent-color:#FF6600; pointer-events:none;'}));
        }
        rowChildren.push(el('div', {style:'font-size:14px; font-weight:600;'}, [tr.desc]));

        ];

        var longPressFired = false;
        function clearPress(){ if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
        function startPress(){
          longPressFired = false;
          clearPress();
          pressTimer = setTimeout(function(){
            longPressFired = true;
            state.txSelectMode = true;
            state.txSelected[tr.id] = true;
            state.txConfirmBulkDelete = false;
            render();
          }, 500);
        }

        listInner.appendChild(el('div', {
          class: 'lb-row-click' + (state.txSelectMode && state.txSelected[tr.id] ? '' : ''),
          style: (state.txSelectMode && state.txSelected[tr.id]) ? 'background:#FEF3E2;' : '',
          onmousedown: startPress, onmouseup: clearPress, onmouseleave: clearPress,

              var anySelected = Object.keys(state.txSelected).some(function(k){ return state.txSelected[k]; });
              if (!anySelected) state.txSelectMode = false;
              render();
            } else {
              openDetail('transaction', tr.id);
            }
          }

  // ---- CASH FLOW ----
  function renderCashflow(container){
    var d = state.data;
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    var monthNames = MONTHS_FULL[state.data.language] || MONTHS_FULL.es;
    var monthTx = d.transactions.filter(function(tr){ return monthKey(tr.date) === currentKey && (!state.accountFilter || tr.accountId === state.accountFilter); });
    var incomeBySource = {}, expenseByCategory = {};
    monthTx.forEach(function(tr){
      var v = convertAmount(tr.amount, tr.currency, d.baseCurrency);
      if (tr.kind === 'income') incomeBySource[tr.category] = (incomeBySource[tr.category]||0) + v;
      else expenseByCategory[tr.category] = (expenseByCategory[tr.category]||0) + v;
    });
    var incomeEntries = Object.keys(incomeBySource).map(function(k){ return [k, incomeBySource[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var expenseEntries = Object.keys(expenseByCategory).map(function(k){ return [k, expenseByCategory[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var totalIncome = incomeEntries.reduce(function(s,e){ return s+e[1]; }, 0);
    var totalExpense = expenseEntries.reduce(function(s,e){ return s+e[1]; }, 0);
    var netIncome = totalIncome - totalExpense;
    var savingsRate = totalIncome > 0 ? (netIncome/totalIncome*100) : 0;

    var prevKey = shiftMonthKey(currentKey, -1);
    var prevTotals = monthTotals(prevKey);
    function pctChange(cur, prev){
      if (prev <= 0) return null;
      return ((cur-prev)/prev*100);
    }
    var incomeChange = pctChange(totalIncome, prevTotals.income);
    var expenseChange = pctChange(totalExpense, prevTotals.expense);

    var cardsGrid = el('div', {class:'lb-metric-grid', style:'display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px;'});
    [
      [t('ingresosTotales'), totalIncome, '#15803D', incomeChange, true],
      [t('gastosTotales'), totalExpense, '#DC2626', expenseChange, false],
      [t('ingresoNeto'), netIncome, netIncome>=0?'#000000':'#DC2626', null, null]
    ].forEach(function(p){
      var cardChildren = [
        el('p', {style:'font-size:12px; color:var(--lb-text-muted); margin:0 0 6px;'}, [p[0]]),
        el('p', {class:'lb-num', style:'font-size:18px; margin:0; font-weight:600; color:'+p[2]+';'}, [fmt(p[1],state.data.baseCurrency)])
      ];
      if (p[3] !== null){
        var up = p[3] >= 0;
        var goodDirection = p[4] ? up : !up;
        var changeColor = goodDirection ? '#15803D' : '#DC2626';
        cardChildren.push(el('p', {style:'font-size:11px; margin:4px 0 0; color:'+changeColor+';'}, [(up?'\u2191 ':'\u2193 ')+Math.abs(p[3]).toFixed(0)+'% '+t('vsMesAnterior')]));
      }
      cardsGrid.appendChild(el('div', {class:'lb-card'}, cardChildren));
    });
    cardsGrid.appendChild(el('div', {class:'lb-card'}, [
      el('p', {style:'font-size:12px; color:var(--lb-text-muted); margin:0 0 6px;'}, [t('tasaAhorro')]),
      el('p', {class:'lb-num', style:'font-size:18px; margin:0; font-weight:600;'}, [savingsRate.toFixed(1)+'%'])
    ]));
    container.appendChild(cardsGrid);

    var liquidBalance = d.accounts.filter(function(a){ return a.type === 'cash' || a.type === 'savings'; })
      .reduce(function(s,a){ return s + convertAmount(a.balance, a.currency, d.baseCurrency); }, 0);
    var recentMonths = [shiftMonthKey(currentKey,-1), shiftMonthKey(currentKey,-2), shiftMonthKey(currentKey,-3)];
    var avgExpense = recentMonths.reduce(function(s,k){ return s + monthTotals(k).expense; }, 0) / recentMonths.length;
    if (avgExpense > 0){
      var coverageMonths = liquidBalance / avgExpense;
      var runwayCard = el('div', {class:'lb-card', style:'margin-bottom:16px;'});
      runwayCard.appendChild(el('p', {style:'font-size:12px; color:var(--lb-text-muted); margin:0 0 6px;'}, ['Colch\u00f3n de ahorro']));
      runwayCard.appendChild(el('p', {style:'font-size:14px; margin:0;'}, [
        el('span', {class:'lb-num', style:'font-weight:600;'}, [coverageMonths.toFixed(1) + ' meses']),
        ' de gastos cubiertos con tu efectivo y ahorro actual, al ritmo medio de los \u00faltimos 3 meses (' + fmt(avgExpense,state.data.baseCurrency) + '/mes).'
      ]));
      container.appendChild(runwayCard);
    }

    var toggleRow = el('div', {style:'display:inline-flex; gap:2px; background:var(--lb-bg-alt); border-radius:11px; padding:3px;'});
    var viewBtnMonth = el('button', {class: 'lb-segment-btn' + (state.cashflowView !== 'trend' ? ' active' : ''), onclick: function(){ state.cashflowView = 'month'; render(); }}, [t('esteMs')]);
    var viewBtnTrend = el('button', {class: 'lb-segment-btn' + (state.cashflowView === 'trend' ? ' active' : ''), onclick: function(){ state.cashflowView = 'trend'; render(); }}, [t('tendencia')]);
    toggleRow.appendChild(viewBtnMonth); toggleRow.appendChild(viewBtnTrend);

    if (state.cashflowView !== 'trend'){
      if (incomeEntries.length === 0){
        var emptyCard = el('div', {class:'lb-card', style:'margin-bottom:16px;'});
        emptyCard.appendChild(el('p', {class:'lb-section-title', style:'margin:0 0 2px;'}, ['Cash flow']));
        emptyCard.appendChild(el('p', {class:'lb-serif', style:'font-size:16px; margin:0 0 14px;'}, [monthNames[now.getMonth()] + ' ' + now.getFullYear()]));
        emptyCard.appendChild(el('p', {style:'font-size:13px; color:var(--lb-text-muted);'}, ['Sin ingresos registrados este mes todav\u00eda.']));
        container.appendChild(emptyCard);
        return;
      }
      function capEntries(entries, max){
        if (entries.length <= max) return entries.slice();
        var kept = entries.slice(0, max-1);
        var restSum = entries.slice(max-1).reduce(function(s,e){ return s+e[1]; }, 0);
        var otrosIdx = kept.findIndex(function(e){ return e[0] === 'Otros'; });
        if (otrosIdx >= 0) kept[otrosIdx] = [kept[otrosIdx][0], kept[otrosIdx][1] + restSum];
        else kept.push(['Otros', restSum]);
        return kept;
      }
      var leftEntries = capEntries(incomeEntries, 6);
      var rightEntries = capEntries(expenseEntries, 6);
      if (netIncome > 0) rightEntries.push(['Ahorro', netIncome]);

      var periodLabel = monthNames[now.getMonth()] + ' ' + now.getFullYear();
      var incomeCard = el('div', {class:'lb-card', style:'margin-bottom:16px;'});
      incomeCard.appendChild(el('div', {style:'display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;'}, [
        el('p', {class:'lb-serif', style:'font-size:16px; margin:0;'}, ['Ingresos']),
        toggleRow
      ]));
      incomeCard.appendChild(el('p', {style:'font-size:11px; color:var(--lb-text-muted); margin:-8px 0 8px;'}, [periodLabel]));
      incomeCard.appendChild(el('p', {class:'lb-num', style:'font-size:22px; font-weight:600; margin:0 0 14px;'}, [fmt(totalIncome,state.data.baseCurrency)]));
      incomeCard.appendChild(segmentedBar(leftEntries, CHART_COLORS));
      incomeCard.appendChild(segmentedLegend(leftEntries, CHART_COLORS, state.data.rate));

  // ---- DEUDAS ----
  async function refreshCryptoPrices(){
    var holdings = (state.data.holdings || []).filter(function(h){ return !!h.coinId; });
    if (!holdings.length) return;
    var ids = [];
    holdings.forEach(function(h){ if (ids.indexOf(h.coinId) === -1) ids.push(h.coinId); });
    state.cryptoFetching = true;
    state.cryptoErrorMsg = null;
    render();
    try {
      var prices = await fetchCryptoPrices(ids, state.data.baseCurrency);
      state.cryptoPrices = prices;
      holdings.forEach(function(h){
        if (typeof prices[h.coinId] === 'number'){
          h.currentPrice = prices[h.coinId];
        }
      });
      saveData();
    } catch(err){
      console.error('Error al consultar precios cripto', err);
      state.cryptoErrorMsg = t('errorPrecios');
    }
    state.cryptoFetching = false;
    render();
  }

      [personInput, dirSelect, amountInput, curSelect, descInput, dueInput, accSelect].forEach(function(x){ grid.appendChild(x); });

      form.appendChild(el('button', {class:'lb-btn', onclick: async function(){
        if (!personInput.value.trim() || amountInput.value === '') return;
        var debtId = uid();
        var debt = { id: debtId, person: personInput.value.trim(), direction: dirSelect.value, amount: Math.abs(parseFloat(amountInput.value)), currency: curSelect.value, description: descInput.value.trim(), dueDate: dueInput.value || null, settled: false, lendAccountId: null, lendTxId: null };
        if (dirSelect.value === 'owed' && accSelect.value){
          var lendTxId = uid();
          var tr = { id: lendTxId, date: new Date().toISOString().slice(0,10), desc: 'Pr\u00e9stamo a ' + debt.person + (debt.description ? ' \u2014 ' + debt.description : ''), amount: debt.amount, currency: debt.currency, kind: 'expense', category: 'Deudas', accountId: accSelect.value, goalId: null, debtId: debtId };

  // ---- IMPORTAR (CSV o extracto PDF) ----
  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n' || c === '\r'){
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else { field += c; }
      }
    }
    if (field !== '' || row.length > 0){ row.push(field); rows.push(row); }
    if (rows.length === 0) return { fields: [], data: [] };
    var fields = rows[0].map(function(f){ return f.trim(); });
    var data = rows.slice(1).filter(function(r){ return r.some(function(v){ return v !== ''; }); }).map(function(r){
      var obj = {};
      fields.forEach(function(f, idx){ obj[f] = r[idx] !== undefined ? r[idx] : ''; });
      return obj;
    });
    return { fields: fields, data: data };
  }
  function readFileAsText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }
  function extractPdfText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        try {
          if (typeof pdfjsLib === 'undefined'){ reject(new Error('pdfjs no disponible')); return; }
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          var loadingTask = pdfjsLib.getDocument({ data: reader.result });
          loadingTask.promise.then(function(pdf){
            var pagePromises = [];
            for (var i = 1; i <= pdf.numPages; i++){
              pagePromises.push(pdf.getPage(i).then(function(page){
                return page.getTextContent().then(function(tc){
                  var lines = {};
                  tc.items.forEach(function(it){
                    var y = Math.round(it.transform[5]);
                    lines[y] = (lines[y] || '') + it.str + ' ';
                  });
                  return Object.keys(lines).sort(function(a,b){ return b-a; }).map(function(k){ return lines[k]; }).join('\n');
                });
              }));
            }
            Promise.all(pagePromises).then(function(pages){ resolve(pages.join('\n')); }).catch(reject);
          }).catch(reject);
        } catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }
  function parseStatementText(text){
    var lines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    var dateRe = /\b(\d{1,2}[\/\-\s](?:\d{1,2}|[A-Za-z]{3,9})[\/\-\s]\d{2,4})\b/;
    var amountRe = /-?\$?\d{1,3}(?:,\d{3})*\.\d{2}/g;
    var rows = [];
    lines.forEach(function(line){
      var dm = line.match(dateRe);
      if (!dm) return;
      var amounts = line.match(amountRe);
      if (!amounts || amounts.length === 0) return;
      var rawAmount = amounts[0];
      var amount = parseFloat(rawAmount.replace(/[$,]/g,''));
      if (isNaN(amount) || amount === 0) return;
      var desc = line.replace(dm[0], '').replace(rawAmount, '').replace(/\s+/g,' ').trim();
      if (desc.length > 60) desc = desc.slice(0,60);
      var isoDate = dm[0];
      var parsed = new Date(dm[0].replace(/-/g,'/'));
      if (!isNaN(parsed)) isoDate = parsed.toISOString().slice(0,10);
      rows.push({ date: isoDate, desc: desc || 'Movimiento', amount: Math.abs(amount).toFixed(2), kind: (rawAmount.indexOf('-')===0) ? 'expense' : 'income' });
    });
    return rows;
  }

  var systemDarkQuery = (typeof window.matchMedia === 'function') ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyColorMode(){
    var mode = state.data.colorMode || 'system';
    var actual = mode === 'system' ? (systemDarkQuery && systemDarkQuery.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', actual);
  }
  if (systemDarkQuery){
    var onSystemThemeChange = function(){ if ((state.data.colorMode || 'system') === 'system') applyColorMode(); };
    if (systemDarkQuery.addEventListener) systemDarkQuery.addEventListener('change', onSystemThemeChange);
    else if (systemDarkQuery.addListener) systemDarkQuery.addListener(onSystemThemeChange);
  }
  var FONT_SCALE = { small: 0.88, medium: 1, large: 1.22 };
  function applyFontSize(){
    var app = document.getElementById('libra-app');
    if (!app) return;
    var scale = FONT_SCALE[state.data.fontSize] || 1;
    if (scale === 1) return;
    var all = app.querySelectorAll('*');
    for (var i = 0; i < all.length; i++){
      var el = all[i];
      var fs = el.style && el.style.fontSize;
      if (!fs) continue;
      if (!el.dataset.origFontSize) el.dataset.origFontSize = fs;
      var match = /^([\d.]+)(px|em)$/.exec(el.dataset.origFontSize);
      if (!match) continue;
      var val = parseFloat(match[1]) * scale;
      el.style.fontSize = (Math.round(val * 100) / 100) + match[2];
    }
  }
  function checkDebtReminder(){
    var freq = state.data.debtReminderFreq || 'off';
    if (freq === 'off') return;
    var pending = state.data.debts.filter(function(d){ return !d.settled; });
    if (pending.length === 0) return;
    var thresholdDays = freq === 'weekly' ? 7 : 30;
    var last = state.data.lastDebtReminderShown ? new Date(state.data.lastDebtReminderShown) : null;
    var now = new Date();
    if (last && (now - last) < thresholdDays * 24 * 60 * 60 * 1000) return;
    var totalOwedToMe = pending.filter(function(d){ return d.direction === 'owed'; }).reduce(function(s,d){ return s + convertAmount(d.amount, d.currency, state.data.baseCurrency); }, 0);
    var totalIOwe = pending.filter(function(d){ return d.direction !== 'owed'; }).reduce(function(s,d){ return s + convertAmount(d.amount, d.currency, state.data.baseCurrency); }, 0);
    var parts = [];
    if (totalOwedToMe > 0) parts.push(t('meDebe') + ' ' + fmt(totalOwedToMe, state.data.baseCurrency));
    if (totalIOwe > 0) parts.push(t('leDebo') + ' ' + fmt(totalIOwe, state.data.baseCurrency));
    state.toastQueue = state.toastQueue || [];
    state.toastQueue.push({ icon: '\uD83D\uDCCB', text: t('recordatorioDeudas').split('{N}').join(pending.length) + ' \u00b7 ' + parts.join(' \u00b7 '), onClick: function(){ state.tab = 'deudas'; render(); } });
    state.data.lastDebtReminderShown = now.toISOString();
    saveData();
  }
  function renderToasts(){
    var root = document.getElementById('lb-toast-root');
    var queue = state.toastQueue || [];
    if (queue.length === 0) return;
    var item = queue.shift();
    var toast = el('div', {class:'lb-toast', style: item.onClick ? 'cursor:pointer;' : '', onclick: function(e){
      if (e.target.closest('.lb-toast-close')) return;
      toast.remove();
      if (item.onClick) item.onClick();
    }}, [
      el('span', {}, [item.icon]),
      el('span', {}, [item.text]),
      el('button', {class:'lb-toast-close', onclick: function(e){ e.stopPropagation(); toast.remove(); }}, ['\u2715'])
    ]);
    root.appendChild(toast);
    var dismissTimer = setTimeout(function(){ if (toast.parentNode) toast.remove(); }, 8000);
    toast.addEventListener('mouseenter', function(){ clearTimeout(dismissTimer); });
    toast.addEventListener('mouseleave', function(){ dismissTimer = setTimeout(function(){ if (toast.parentNode) toast.remove(); }, 3000); });
  }
  var lastRenderedTab = null;
  var wasLoading = true;
  function render(){
    renderNav();
    renderGlobalSearch();
    renderHero();
    var content = document.getElementById('lb-content');
    content.innerHTML = '';
    var isFreshTab = (state.tab !== lastRenderedTab) || wasLoading;
    lastRenderedTab = state.tab;
    wasLoading = state.loading;
    var wrap = el('div', {class: isFreshTab ? 'lb-fade-in' : ''});
    content.appendChild(wrap);
    if (state.loading){ wrap.appendChild(el('p', {style:'font-size:13px; color:var(--lb-text-muted);'}, [t('cargandoDatos')])); return; }
    if (state.tab === 'dashboard') renderDashboard(wrap);
    else if (state.tab === 'cuentas') renderCuentas(wrap);
    else if (state.tab === 'transacciones') renderTransacciones(wrap);
    else if (state.tab === 'recurrentes') renderRecurrentes(wrap);
    else if (state.tab === 'cashflow') renderCashflow(wrap);
    else if (state.tab === 'gastos') renderGastos(wrap);
    else if (state.tab === 'ingresos') renderIngresos(wrap);
    else if (state.tab === 'presupuesto') renderPresupuesto(wrap);
    else if (state.tab === 'metas') renderMetas(wrap);
    else if (state.tab === 'deudas') renderDeudas(wrap);
    else if (state.tab === 'cripto') renderCripto(wrap);
    else if (state.tab === 'importar') renderImportar(wrap);
    else if (state.tab === 'ajustes') renderAjustes(wrap);
    renderModal();
    applyFontSize();
    applyColorMode();
    renderToasts();
  }

  render();
  loadData();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){ console.error('SW registration failed', err); });
    });
  }
</script>
</body>
</html>
